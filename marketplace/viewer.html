<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer</title>
    <script src="viewer.js" type="module"></script>
  </head>
  <body>
    <div
      x-data="viewer"
      class="h-screen border border-p-soft max-w-[70%] max-h-[90%]"
    >
      <template x-if="item">
        <div class="h-full">
          <figure>
            <img
              :src="'/api/assets/' + item.image"
              class="absolute inset-0 w-full h-full object-cover mix-blend-multiply"
            />
          </figure>

          <div
            class="flex flex-col justify-start md:justify-center gap-4 h-full overflow-y-auto"
          >
            <h1 class="text-lg text-p-dark" x-text="item.name"></h1>

            <div class="grid grid-cols-2 gap-4">
              <div class="flex flex-col">
                <h2 class="text-xs font-semibold text-p-medium uppercase">
                  Museo
                </h2>
                <p class="text-p-dark" x-text="item.museum"></p>
              </div>
              <div class="flex flex-col">
                <h2 class="text-xs font-semibold text-p-medium uppercase">
                  Data
                </h2>
                <p class="text-p-dark" x-text="item.date"></p>
              </div>
            </div>

            <div class="flex flex-col">
              <h2 class="text-xs font-semibold text-p-medium uppercase">
                Descrizioni disponibili
              </h2>

              <template x-if="item.explanations?.[0]">
                <div>
                  <span>Livello semplice</span>
                  <p
                    class="text-p-dark font-sans mt-1"
                    x-text="item.explanations[0].text"
                  ></p>
                </div>
              </template>

              <template x-if="item.explanations?.[1]">
                <div>
                  <span>Livello normale</span>
                  <p
                    class="text-p-dark font-sans mt-1"
                    x-text="item.explanations[1].text"
                  ></p>
                </div>
              </template>

              <template x-if="item.explanations?.[2]">
                <div>
                  <span>Livello avanzato</span>
                  <p
                    class="text-p-dark font-sans mt-1"
                    x-text="item.explanations[2].text"
                  ></p>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </body>
</html>
