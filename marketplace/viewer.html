<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer</title>
    <link href="../styles.css" rel="stylesheet" type="text/css" />
    <script src="viewer.js" type="module"></script>
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div x-data="viewer" class="h-screen flex flex-col p-4 gap-4">
      <template x-if="nav?.item">
        <div class="contents">
          <!-- Main Detail View Card -->
          <div
            class="flex-[2] min-h-0 mx-auto grid w-full max-w-4xl grid-cols-1 md:grid-cols-2 gap-6 bg-white rounded-3xl shadow-lg border border-p-soft p-6"
          >
            <!-- Image Container -->
            <figure
              class="w-full max-h-full aspect-square rounded-2xl overflow-hidden justify-self-center self-center"
            >
              <img
                :src="'/api/assets/' + nav.item.image"
                :alt="nav.item.name"
                class="object-cover w-full h-full"
              />
            </figure>

            <!-- Item Info -->
            <div
              class="flex flex-col justify-start md:justify-center gap-4 h-full overflow-y-auto"
            >
              <h1
                class="font-serif text-4xl text-p-medium font-bold"
                x-text="nav.item.name"
              ></h1>
              <p
                class="text-lg text-p-dark"
                x-text="nav.item.author || nav.item.artist"
              ></p>

              <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col">
                  <h2 class="text-xs font-semibold text-p-medium uppercase">
                    Museo
                  </h2>
                  <p class="text-p-dark" x-text="nav.item.museum"></p>
                </div>
                <div class="flex flex-col">
                  <h2 class="text-xs font-semibold text-p-medium uppercase">
                    Data
                  </h2>
                  <p class="text-p-dark" x-text="nav.item.date"></p>
                </div>
              </div>

              <div class="flex flex-col gap-2">
                <h2 class="text-xs font-semibold text-p-medium uppercase">
                  Descrizione
                </h2>

                <template x-if="nav.item.explanations?.[0]">
                  <div>
                    <span
                      class="text-xs font-semibold text-p-medium/70 uppercase"
                      >Livello semplice</span
                    >
                    <p
                      class="text-p-dark font-sans mt-0.5"
                      x-text="nav.item.explanations[0].text"
                    ></p>
                  </div>
                </template>

                <template x-if="nav?.item?.explanations?.[1]">
                  <div>
                    <span
                      class="text-xs font-semibold text-p-medium/70 uppercase"
                      >Livello normale</span
                    >
                    <p
                      class="text-p-dark font-sans mt-0.5"
                      x-text="nav.item.explanations[1].text"
                    ></p>
                  </div>
                </template>

                <template x-if="nav?.item?.explanations?.[2]">
                  <div>
                    <span
                      class="text-xs font-semibold text-p-medium/70 uppercase"
                      >Livello avanzato</span
                    >
                    <p
                      class="text-p-dark font-sans mt-0.5"
                      x-text="nav.item.explanations[2].text"
                    ></p>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- Navigation Controls (Return, Prev and Next) -->
          <div
            class="flex-none h-auto mx-auto w-full max-w-4xl flex justify-end items-center px-4 pb-4"
          >
            <div class="flex items-center justify-center mr-4 w-16">
              <a
                href="/marketplace/"
                class="shared-button-flex-secondary w-12 h-12 shadow-md border border-p-soft hover:border-transparent flex items-center justify-center group"
              >
                <svg
                  width="36"
                  height="36"
                  viewBox="0 0 48 48"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <rect
                    width="48"
                    height="48"
                    rx="12"
                    fill="none"
                    stroke="none"
                  />
                  <path
                    d="M12 20 L15 12 H33 L36 20 V24 H34 V36 H14 V24 H12 V20 Z M18 24 V34 H30 V24 H18 Z M16 18 H32 L30 14 H18 L16 18 Z"
                    fill="var(--color-p-medium)"
                    class="group-hover:fill-[var(--color-p-light)] transition-colors"
                  />
                </svg>
              </a>
            </div>
            <div class="flex items-center justify-center gap-4 w-full">
              <!-- Previous Button -->
              <button
                @click="nav.prev()"
                class="shared-button-flex-secondary rounded-md w-16 h-16 shadow-lg border border-p-soft hover:border-transparent flex items-center justify-center"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M15 18l-6-6 6-6" />
                </svg>
              </button>

              <!-- Next Button -->
              <button
                @click="nav.next()"
                class="shared-button-flex-secondary rounded-md w-16 h-16 shadow-lg border border-p-soft hover:border-transparent flex items-center justify-center"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 18l6-6-6-6" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </body>
</html>
