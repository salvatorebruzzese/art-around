<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
    <link href="../styles.css" rel="stylesheet" type="text/css" />
    <script type="module" src="./editor.js" defer></script>
    <script type="module" src="./shared.js" defer></script>
  </head>
  <body
    x-data="editorState()"
    class="h-screen flex flex-col p-6 md:p-10 min-h-screen font-sans text-p-dark bg-white"
  >
    <header
      class="flex flex-wrap justify-center items-center gap-6 mb-10 w-full max-w-7xl mx-auto"
    >
      <quick-nav></quick-nav>
    </header>
    <main class="flex-1 flex max-w-7xl max-h-screen mx-auto gap-8">
      <!-- Main form -->
      <form
        @submit.prevent="submitForm"
        class="w-1/2 mx-auto flex flex-col text-p-medium gap-5 bg-white p-8 rounded-3xl shadow-sm border border-p-soft"
      >
        <div class="border-b border-p-soft pb-4 mb-2">
          <h1 class="text-2xl text-p-medium font-bold">Modifica Item</h1>
        </div>
        <div class="flex flex-col gap-1 w-full">
          <label class="text-sm font-medium">Nome dell'item</label>
          <input
            type="text"
            x-model="formData.name"
            required
            class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium transition-shadow"
          />
        </div>
        <div class="flex flex-col gap-1 w-full">
          <label class="text-sm font-medium">Licenza d'uso</label>
          <input
            type="text"
            x-model="formData.license"
            class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
          />
        </div>
        <fieldset
          class="border border-p-soft p-5 rounded-2xl bg-p-soft/20 mt-2"
        >
          <legend class="font-semibold bg-p-light rounded-lg">
            Spiegazione
          </legend>
          <div class="flex flex-col gap-4 mt-2">
            <div class="flex flex-col gap-1 w-full md:w-1/2">
              <label class="text-sm font-medium">Livello</label>
              <select
                x-model="formData.explanations[0].level"
                required
                class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
              >
                <option value="simple">Semplice</option>
                <option value="normal">Normale</option>
                <option value="advanced">Avanzato</option>
              </select>
            </div>
            <div class="flex flex-col gap-1 w-full">
              <label class="text-sm font-medium">Testo</label>
              <textarea
                x-model="formData.explanations[0].text"
                required
                rows="4"
                class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium resize-none"
              ></textarea>
            </div>
          </div>
        </fieldset>
        <button
          type="submit"
          class="shared-button-full-primary"
          x-text="typeof formData._id !== 'number'? 'Salva Modifiche':'Crea'"
        ></button>
      </form>
      <!-- Reorderable Lists -->
      <div class="w-1/2 flex flex-col">
        <div class="flex flex-row col-span-6 gap-2 w-full">
          <button class="shared-button w-30" @click="saveItemNav()">
            Save Order
          </button>
          <div class="w-full flex gap-2" x-data="{ overlayOpen: false }">
            <button
              class="p-2 shared-button-full-primary w-14"
              @click="overlayOpen = true"
            >
              Select
            </button>
            <button
              class="rounded-full shared-button-full-primary w-min-10 w-max-10 w-10"
              @click="newItem()"
            >
              +
            </button>
            <div
              x-show="overlayOpen"
              x-transition
              style="background: rgba(0, 0, 0, 0.3)"
              class="fixed inset-0 flex items-center justify-center z-50"
              @click.self="overlayOpen = false"
              x-init="$watch('overlayOpen', v => { if(v){ document.body.style.overflow = 'hidden' } else { document.body.style.overflow = '' } })"
            >
              <div
                class="bg-white rounded-xl shadow-lg p-6 min-w-[300px] w-1/2 flex flex-col gap-4 relative"
                @click.stop
              >
                <button
                  @click="overlayOpen = false"
                  class="absolute top-2 right-2 text-gray-500 hover:text-black cursor-pointer rounded-full bg-gray-100 w-7 h-7 flex items-center justify-center"
                >
                  &times;
                </button>
                <div class="font-bold text-lg text-p-dark mb-2">
                  Stash Items
                </div>
                <div class="flex flex-col gap-2 max-h-72 overflow-auto">
                  <template x-for="item in allMetaItems" :key="item._id">
                    <div
                      class="flex items-center justify-between group p-2 rounded hover:bg-p-extralight transition-all"
                    >
                      <span class="text-p-dark" x-text="item.name"></span>
                      <button
                        class="rounded-full w-9 shared-button"
                        @click="addItem(item._id)"
                      >
                        +
                      </button>
                    </div>
                  </template>
                  <template x-if="!allMetaItems || allMetaItems.length === 0">
                    <div class="text-gray-400">No items available.</div>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div
          class="grid grid-cols-2 gap-4 min-h-50 h-full shrink-0 items-start pt-2"
        >
          <figure
            class="w-full aspect-video lg:aspect-square bg-white rounded-3xl shadow-sm border border-p-soft"
          >
            <img
              class="rounded-3xl"
              x-data="{cache: null}"
              x-bind:src="
              if(currentItem?.image != cache || !cache){
                if(currentItem?.image){cache = '/api/assets/'+currentItem.image}
                else if (!cache){cache = 'https://dummyimage.com/800x800/efefef/a3a3a3.jpg&text=Loading'}
              }
              return cache
            "
              alt="Thumbnail"
              class="object-cover w-full h-full"
            />
          </figure>
          <template x-if="boards.itemNav">
            <ul
              class="w-full bg-white rounded-lg shadow divide-y divide-gray-200"
              x-data="{
                   expanded: null,
                   }
                   "
            >
              <template
                x-for="(item, idx) in boards.itemNav.arr"
                :key="item._id"
              >
                <div
                  class="reordItem"
                  @drop="boards.itemNav.onDrop(idx, $event)"
                  @dragover.prevent="boards.itemNav.onDragOver(idx, $event)"
                  @dragleave="boards.itemNav.onDragLeave(idx)"
                >
                  <li class="relative group flex items-center">
                    <!-- Drag Handle -->
                    <div
                      class="cursor-grab flex items-center justify-center h-8 w-8 rounded-md hover:bg-gray-100 transition mr-2"
                      draggable="true"
                      @dragstart="boards.itemNav.onDragStart(idx, $event)"
                      @dragend="boards.itemNav.onDragEnd()"
                    >
                      <svg
                        class="w-4 h-4 text-gray-400"
                        fill="currentColor"
                        viewBox="0 0 20 20"
                      >
                        <circle cx="5" cy="6" r="1"></circle>
                        <circle cx="5" cy="10" r="1"></circle>
                        <circle cx="5" cy="14" r="1"></circle>
                        <circle cx="13" cy="6" r="1"></circle>
                        <circle cx="13" cy="10" r="1"></circle>
                        <circle cx="13" cy="14" r="1"></circle>
                      </svg>
                    </div>
                    <!-- Item Label -->
                    <button
                      class="flex-1 text-left px-2 py-4 focus:outline-none bg-transparent"
                      :class="{'bg-blue-100': expanded === item._id }"
                      @click="
          expanded = expanded === item._id ? null : item._id; loadItem(item._id)
        "
                    >
                      <span
                        class="font-medium text-gray-800"
                        x-text="item.name"
                      ></span>
                    </button>
                    <!-- Options: delete or more -->
                    <div x-data="{open: false}" class="relative">
                      <button
                        @click="open = !open"
                        class="btn btn-sm btn-circle bg-white/80 hover:bg-white text-p-dark border-none shadow-md backdrop-blur-sm focus:outline-none list-none"
                      >
                        <svg
                          class="w-5 h-5"
                          fill="currentColor"
                          viewBox="0 0 20 20"
                        >
                          <path
                            d="M10 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4z"
                          />
                        </svg>
                      </button>
                      <div
                        x-show="open"
                        x-transition
                        @click.outside="open = false"
                        class="absolute right-0 z-10 bg-white rounded shadow p-2 min-w-[8rem]"
                      >
                        <ul>
                          <li>
                            <button
                              @click="deleteItem(item); open = false"
                              class="w-full text-left px-4 py-2 text-red-700 hover:bg-red-50 rounded"
                            >
                              Elimina
                            </button>
                          </li>
                          <!-- Add more options here if needed -->
                        </ul>
                      </div>
                    </div>
                    <!-- Drag-under styling (optional) -->
                    <!-- <div -->
                    <!-- x-show="boards.itemNav.isOver(idx)" -->
                    <!-- class="absolute left-0 right-0 bottom-0 h-2 bg-blue-300 opacity-30 pointer-events-none" -->
                    <!-- ></div> -->
                  </li>
                  <!-- Expandable Refs Section -->
                  <li x-show="expanded === item._id" class="p-2">
                    <div
                      class="p-3 rounded-lg mb-2 mt-1"
                      :class="boards.refs.dropZoneStyle"
                      @dragover.prevent
                      @drop="
          boards.refs.onDropEmpty($event)
        "
                    >
                      <span
                        class="font-semibold text-xs text-blue-700"
                        x-text="boards.refs.dropZoneText"
                      ></span>
                      <ul class="mt-3">
                        <template
                          x-for="(ref, rIdx) in boards.refs.arrManager.arr"
                          :key="ref._id"
                        >
                          <li
                            class="reordItem flex items-center px-2 py-2 rounded hover:bg-blue-100 cursor-pointer text-xs text-blue-700"
                            @click="expanded = ref._id; loadItem(ref._id)"
                            draggable="true"
                            @dragstart="boards.refs.onDragStart(rIdx, $event)"
                            @dragend="boards.refs.onDragEnd()"
                            @dragover.prevent="boards.refs.onDragOver(rIdx, $event)"
                            @dragleave="boards.refs.onDragLeave(rIdx)"
                            @drop="boards.refs.onDrop(rIdx, $event)"
                            x-text="ref.name"
                          ></li>
                        </template>
                      </ul>
                    </div>
                  </li>
                </div>
              </template>
            </ul>
          </template>
          <div
            class="fixed flex flex-row bottom-20 right-4 z-50"
            x-data="{ expanded: false }"
            @mouseenter="expanded = true; newStash=false"
            @mouseleave="expanded = false"
            @dragover.prevent="expanded = true; newStash=false"
          >
            <template x-if="expanded && boards.stash">
              <div
                class="w-80 bg-white p-3 min-h-16 rounded-lg shadow-lg transition-all duration-200"
                :class="boards.stash.dropZoneStyle"
                @dragover.prevent=""
                @dragleave=""
                @drop="boards.stash.onDropEmpty($event)"
                style="min-width: 20rem"
              >
                <span
                  class="font-semibold text-xs"
                  x-text="boards.stash.dropZoneText"
                ></span>
                <ul class="mt-2">
                  <template
                    x-for="(item, idx) in boards.stash.arr"
                    :key="item._id"
                  >
                    <li
                      class="flex items-center px-2 py-2 rounded hover:bg-gray-100 cursor-pointer"
                      draggable="true"
                      @dragstart="boards.stash.onDragStart(idx, $event)"
                      @dragend="boards.stash.onDragEnd()"
                      @dragover.prevent="boards.stash.onDragOver(idx, $event)"
                      @dragleave="boards.stash.onDragLeave(idx)"
                      @drop="boards.stash.onDrop(idx, $event)"
                      @click="expanded = item._id; loadItem(item._id)"
                    >
                      <svg
                        class="w-4 h-4 mr-2 text-gray-400 pointer-events-none"
                        fill="currentColor"
                        viewBox="0 0 20 20"
                      >
                        <circle cx="10" cy="10" r="7"></circle>
                      </svg>
                      <span
                        class="flex-1 text-xs text-gray-800"
                        x-text="item.name"
                      ></span>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
            <div
              class="right-0 bottom-0 w-10 h-10 bg-gray-100 flex items-center justify-center rounded-lg shadow cursor-pointer transition-all duration-200"
              :class="newStash ? 'animate-bounce' : ''"
            >
              <svg
                class="w-6 h-6 text-gray-400"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <circle cx="10" cy="10" r="7"></circle>
              </svg>
            </div>
          </div>

          <div
            class="fixed flex flex-row bottom-4 right-4 z-50"
            x-data="{ expanded: false }"
            @mouseenter="expanded = true"
            @mouseleave="expanded = false"
            @dragover.prevent="expanded = true"
          >
            <template x-if="expanded">
              <div
                class="w-80 bg-white p-3 min-h-16 rounded-lg shadow-lg transition-all duration-200"
                :class="boards.toDelete?.dropZoneStyle"
                @dragover.prevent=""
                @dragleave=""
                @drop="boards.toDelete?.onDropEmpty($event)"
                style="min-width: 20rem"
              >
                <span
                  class="font-semibold text-xs"
                  x-text="boards.toDelete?.dropZoneText"
                ></span>
                <ul class="mt-2">
                  <template
                    x-for="(item, idx) in boards.toDelete?.arr"
                    :key="item._id"
                  >
                    <li
                      class="flex items-center px-2 py-2 rounded hover:bg-red-100 cursor-pointer"
                      draggable="true"
                      @dragstart="boards.toDelete.onDragStart(idx, $event)"
                      @dragend="boards.toDelete.onDragEnd()"
                      @dragover.prevent="boards.toDelete.onDragOver(idx, $event)"
                      @dragleave="boards.toDelete.onDragLeave(idx)"
                      @drop="boards.toDelete.onDrop(idx, $event)"
                      @click="expanded = item._id; loadItem(item._id)"
                    >
                      <svg
                        class="w-4 h-4 mr-2 text-red-400 pointer-events-none"
                        fill="currentColor"
                        viewBox="0 0 20 20"
                      >
                        <rect x="4" y="8" width="12" height="4"></rect>
                      </svg>
                      <span
                        class="flex-1 text-xs text-red-800"
                        x-text="item.name"
                      ></span>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
            <div
              class="float-right w-10 h-10 bg-red-100 flex items-center justify-center rounded-lg shadow cursor-pointer transition-all duration-200"
            >
              <svg
                class="w-6 h-6 text-red-400"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <rect x="4" y="8" width="12" height="4"></rect>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
