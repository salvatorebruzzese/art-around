<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>

    <link href="../styles.css" rel="stylesheet" type="text/css" />
    <script type="module" src="./editor.js" defer></script>
    <script type="module" src="./shared.js" defer></script>
  </head>
  <body
    x-data="editorState()"
    class="p-6 md:p-10 min-h-screen font-sans text-p-dark bg-white"
  >
    <!-- Header Navigation -->
    <header
      class="flex flex-wrap justify-center items-center gap-6 mb-10 w-full max-w-7xl mx-auto"
    >
      <quick-nav></quick-nav>
    </header>
    <!-- Content with reorderable list sidebar -->
    <div class="flex w-full max-w-7xl mx-auto gap-10">
      <!-- Reorderable List Sidebar -->
      <aside class="shrink-0 w-64 flex flex-col items-start pt-2">
        <div class="flex w-full gap-2 mb-4">
          <button
            class="shared-button-full-primary w-full"
            @click="if(ghostIdx>itd/2) ghostIdx--"
          >
            UP
          </button>
          <button class="shared-button w-14" @click="ghostIdx = currentItemIdx">
            RE
          </button>
        </div>
        <div id="draggable-list" class="w-full" x-ref="list">
          <template x-for="(item, idx) in someItems" :key="item._id">
            <div
              class="draggable-item flex items-center justify-between rounded-lg bg-white shadow mb-3 px-4 py-3 cursor-grab transition-all select-none"
              :class="{
                'ring-2 ring-red-400 opacity-80': dragging && draggingIdx === idx,
                'bg-gray-100': overIdx === idx && dragging && draggingIdx !== idx
              }"
              draggable="true"
              @dragstart="onDragStart(idx)"
              @dragend="onDragEnd"
              @dragover.prevent="onDragOver(idx, $event)"
              @dragleave="onDragLeave(idx)"
              @drop="onDrop(idx, $event)"
              x-show="doView(item._id)"
            >
              <label class="flex items-center cursor-pointer">
                <input
                  type="radio"
                  class="form-radio text-blue-600 mr-3"
                  name="itemRadio"
                  x-model="currentItemId"
                  :value="item._id"
                  @input="loadItem(item._id)"
                />
                <span
                  class="flex-1 text-base font-medium text-gray-800 text-center"
                  x-text="item.name"
                ></span>
              </label>
            </div>
          </template>
          <button
            class="shared-button-full-primary"
            @click="
                   if(ghostIdx<items.length - 3) {ghostIdx++}"
          >
            DOWN
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main
        class="flex-1 grid lg:grid-cols-2 gap-10 items-start w-full max-w-7xl mx-auto"
      >
        <!-- Main content goes here -->
        <!-- Media Preview -->
        <figure
          class="w-full aspect-video lg:aspect-square bg-white rounded-3xl overflow-hidden shadow-sm border border-p-soft"
        >
          <img
            x-bind:src="currentItem?.image ? '/api/assets/'+currentItem.image : 'https://dummyimage.com/800x800/efefef/a3a3a3.jpg&text=Not+Found'"
            alt="Thumbnail"
            class="object-cover w-full h-full"
          />
        </figure>

        <!-- Data Form -->
        <form
          @submit.prevent="submitForm"
          class="flex flex-col text-p-medium gap-5 bg-white p-8 rounded-3xl shadow-sm border border-p-soft"
        >
          <div class="border-b border-p-soft pb-4 mb-2">
            <h1 class="text-2xl text-p-medium font-bold">Modifica Item</h1>
          </div>

          <div class="flex flex-col gap-1 w-full">
            <label class="text-sm font-medium">Nome dell'item</label>
            <input
              type="text"
              x-model="formData.name"
              required
              class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium transition-shadow"
            />
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex flex-col gap-1 w-full">
              <label class="text-sm font-medium"
                >Tipo di item (deprecato)</label
              >
              <select
                class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
              >
                <option value="artist">Artista</option>
                <option value="style">Stile</option>
                <option value="technique">Tecnica</option>
                <option value="artwork">Opera</option>
                <option value="other">Altro</option>
              </select>
            </div>

            <div class="flex flex-col gap-1 w-full">
              <label class="text-sm font-medium">Tour</label>
              <input
                type="text"
                x-model="formData.tour"
                required
                class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
              />
            </div>
          </div>

          <div class="flex flex-col gap-1 w-full">
            <label class="text-sm font-medium">Licenza d'uso</label>
            <input
              type="text"
              x-model="formData.license"
              class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
            />
          </div>

          <!-- Mongoose Sub-schema Mapping -->
          <fieldset
            class="border border-p-soft p-5 rounded-2xl bg-p-soft/20 mt-2"
          >
            <legend class="font-semibold bg-p-light rounded-lg">
              Spiegazione
            </legend>
            <div class="flex flex-col gap-4 mt-2">
              <div class="flex flex-col gap-1 w-full md:w-1/2">
                <label class="text-sm font-medium">Livello</label>
                <select
                  x-model="formData.explanations[0].level"
                  required
                  class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
                >
                  <option value="simple">Semplice</option>
                  <option value="normal">Normale</option>
                  <option value="advanced">Avanzato</option>
                </select>
              </div>
              <div class="flex flex-col gap-1 w-full">
                <label class="text-sm font-medium">Testo</label>
                <textarea
                  x-model="formData.explanations[0].text"
                  required
                  rows="4"
                  class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium resize-none"
                ></textarea>
              </div>
            </div>
          </fieldset>

          <button
            type="submit"
            class="shared-button-full-primary"
            x-text="formData._id ? 'Salva Modifiche':'Crea'"
          ></button>
        </form>
      </main>
    </div>
  </body>
</html>
