<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
    <link href="../styles.css" rel="stylesheet" type="text/css" />
    <script type="module" src="./editor.js" defer></script>
  </head>

  <body
    x-data="editorState"
    x-init="initByURL()"
    class="flex flex-col items-center max-w-screen bg-white text-p-dark"
  >
    <header class="w-full p-8">
      <quick-nav></quick-nav>
    </header>

    <div class="flex flex-1 xl:w-[80vw] 2xl:w-[66vw]">
      <!--Sidebar-->
      <div class="w-max" x-data="{asideOpen: false}">
        <button
          class="md:hidden fixed bottom-4 left-4 z-50 w-[15vw] h-[15vw] rounded-full bg-[var(--color-p-dark)] text-[var(--color-p-light)] text-2xl"
          @click="asideOpen = !asideOpen"
          aria-label="Open sidebar"
        >
          ☰
        </button>

        <aside
          class="flex flex-col gap-6 fixed top-0 left-0 h-full min-w-[66vw] bg-white z-50 transform transition-transform duration-200 -translate-x-full md:translate-x-0 md:static md:sticky md:top-0 md:min-w-[20%] md:w-64 lg:w-max md:h-screen"
          :class="{ '-translate-x-full': !asideOpen, 'translate-x-0': asideOpen }"
          @keydown.escape.window="open = false"
          x-show="asideOpen || window.innerWidth >= 768"
          x-transition
          x-data="{custom: []}"
          style="overflow: auto"
        >
          <div class="flex justify-end">
            <button
              class="float-right md:hidden z-50 w-[15vw] h-[15vw] rounded-full bg-[var(--color-p-light)] text-[var(--color-p-dark)] text-2xl"
              @click="asideOpen = false"
            >
              &times;
            </button>
          </div>

          <template
            x-for="(list, idx) in [
                     {
                        name: 'Navigazione',
                        arr: itemNav,
                        get selection(){return Object.keys(items)}

                     },{
                        name: 'Stash',
                        arr:[],
                        get selection() { return Object.keys(items)}

                     }]"
          >
            <div>
              <div
                class="w-full flex justify-between items-center border-b border-p-soft p-4 mb-2"
                x-data="{openSelect:false}"
              >
                <div class="w-max flex gap-6">
                  <button
                    class="shared-button-full-primary w-7"
                    @click="()=>{ openSelect = true}"
                  >
                    +
                  </button>
                  <h1
                    class="text-2xl text-p-medium font-bold"
                    x-text="list.name"
                  ></h1>
                  <!-- Overlay for '+' item selection -->
                  <template x-if="openSelect">
                    <div
                      x-show="openSelect"
                      class="flex flex-col fixed top-0 left-0 h-full w-full bg-white bg-opacity-80 z-60"
                      x-data="{addList: []}"
                    >
                      <header class="flex justify-between">
                        <h1 class="text-2xl text-p-medium font-bold">
                          Seleziona un item
                        </h1>
                        <button
                          class="float-right w-[15vw] h-[15vw] md:w-10 md:h-10 rounded-full bg-[var(--color-p-light)] text-[var(--color-p-dark)] text-2xl"
                          @click="openSelect = false"
                        >
                          &times;
                        </button>
                      </header>
                      <ul>
                        <template x-for="id in list.selection">
                          <li>
                            <input type="checkbox" @click="addList.push(id)" />
                            <span
                              class="text-left"
                              x-text="items[id].name"
                            ></span>
                          </li>
                        </template>
                      </ul>
                      <button
                        class="shared-button-primary"
                        @click="list.arr = list.arr.concat(addList); openSelect = false"
                      >
                        Ok
                      </button>
                    </div>
                  </template>
                  <!-- End of overlay selection -->
                </div>
              </div>
              <ul class="flex flex-col gap-6">
                <template x-for="id in list.arr">
                  <li
                    class="flex justify-start shared-button-flex-secondary p-2"
                  >
                    <div class="flex flex-col items-center mr-3">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="mb-2 shared-button-flex-secondary"
                        @click="() => {
                           const idx = itemNav.findIndex((i) => i === id);
                            if (idx >= 0) {
                                const [item] = itemNav.splice(idx, 1);
                                itemNav.splice(idx - 1, 0, item);
                                console.log(itemNav)
                            }
                           }"
                      >
                        <path d="M12 5v14M5 12l7-7 7 7" />
                      </svg>
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="shared-button-flex-secondary"
                        @click="() => {
                           const idx = itemNav.findIndex((i) => i === id);
                            if (idx >= 0) {
                                const [item] = itemNav.splice(idx, 1);
                                itemNav.splice(idx + 1, 0, item);
                            }
                           }"
                      >
                        <path d="M12 19V5M19 12l-7 7-7-7" />
                      </svg>
                    </div>
                    <span class="text-left" x-text="items[id].name"></span>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </aside>

        <!-- Overlay (mobile only, appears when sidebar open) -->
        <div
          x-show="asideOpen"
          class="fixed inset-0 z-40 md:hidden"
          @click="asideOpen = false"
          x-transition.opacity
          style="background-color: rgba(0, 0, 0, 0.5)"
        ></div>
      </div>
      <!-- Main content -->
      <main
        class="flex-1 md:mr-6 md:ml-6"
        x-data="{
              tabs: [
                {name: 'Edit Item', id:'edit_item', active: 'bg-blue-100  rounded-t-3xl border-t border-l border-p-soft', inactive: 'bg-white'},
                {name: 'Edit Tour', id:'edit_tour', active: 'bg-blue-100 rounded-t-3xl border-t border-r border-p-soft', inactive:'bg-white'},
              ],
              activeTab: 'edit_item',
              init() {
                const params = new URLSearchParams(window.location.search);
                if (params.has('tab'))
                    this.activeTab = params.get('tab');
              },
            }"
      >
        <header id="tab_select" class="w-full flex min-h-10">
          <template x-for="tab in tabs">
            <button
              :id="tab.id"
              class="flex-1"
              :class="tab.id == activeTab ? tab.active : tab.inactive "
              @click="activeTab = tab.id"
              x-text="tab.name"
            ></button>
          </template>
        </header>
        <section
          x-show="activeTab == 'edit_item'"
          class="w-full rounded-tr-3xl rounded-br-3xl rounded-bl-3xl shadow-sm border border-p-soft"
        >
          <template x-if="selectedId && items[selectedId] ">
            <div class="w-full flex flex-col p-4">
              <div class="border-b border-p-soft p-4 mb-2">
                <h1 class="text-2xl text-p-medium font-bold">Modifica Item</h1>
              </div>
              <form
                x-data="{formData: items[selectedId]}"
                @submit.prevent="saveItem(items[selectedId])"
                class="grid grid-cols-1 md:grid-cols-2 text-p-medium md:p-8 gap-6"
              >
                <div class="flex flex-col row-span-6">
                  <figure>
                    <img
                      :src="formData.image ? '/api/assets/'+formData.image : ''"
                      :alt="formData.imageAlt ? formData.imageAlt : 'Item image'"
                    />
                  </figure>
                </div>
                <div class="flex flex-col gap-1 w-full">
                  <label class="text-sm font-medium">Nome dell'item</label>
                  <input
                    type="text"
                    x-model="formData.name"
                    required
                    class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium transition-shadow"
                  />
                </div>
                <div class="flex flex-col gap-1 w-full">
                  <label class="text-sm font-medium">Licenza d'uso</label>
                  <input
                    type="text"
                    x-model="formData.license"
                    class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
                  />
                </div>
                <fieldset
                  class="border border-p-soft p-5 rounded-2xl bg-p-soft/20 mt-2"
                >
                  <legend class="font-semibold bg-p-light rounded-lg">
                    Spiegazione
                  </legend>
                  <div class="flex flex-col gap-4 mt-2">
                    <div class="flex flex-col gap-1 w-full md:w-1/2">
                      <label class="text-sm font-medium">Livello</label>
                      <select
                        x-model="formData.explanations[0].level"
                        required
                        class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
                      >
                        <option value="simple">Semplice</option>
                        <option value="normal">Normale</option>
                        <option value="advanced">Avanzato</option>
                      </select>
                    </div>
                    <div class="flex flex-col gap-1 w-full">
                      <label class="text-sm font-medium">Testo</label>
                      <textarea
                        x-model="formData.explanations[0].text"
                        required
                        rows="4"
                        class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium resize-none"
                      ></textarea>
                    </div>
                  </div>
                </fieldset>
                <button
                  type="submit"
                  class="shared-button-full-primary"
                  x-text="typeof formData._id !== 'number'? 'Salva Modifiche':'Crea'"
                ></button>
              </form>
            </div>
          </template>
        </section>
        <section x-show="activeTab == 'edit_tour'">edit item</section>
      </main>
    </div>
  </body>
</html>
