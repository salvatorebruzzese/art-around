<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>

    <link href="../styles.css" rel="stylesheet" type="text/css" />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body class="p-10 overflow-y-auto w-full">
    <header
      class="flex flex-wrap flex-row-reverse justify-between items-start gap-6 font-sans"
    >
      <div class="flex flex-row justify-center items-center gap-3">
        <div class="flex items-center gap-2">
          <a
            class="w-10 h-10 border border-p-soft rounded-xl hover:bg-p-soft transition-colors shadow-md text-2xl text-center"
            href="../home/"
            >H</a
          >
          <a
            class="w-10 h-10 border border-p-soft rounded-xl hover:bg-p-soft transition-colors shadow-md text-2xl text-center"
            href="/marketplace/"
            >M</a
          >
          <a
            class="w-10 h-10 border border-p-soft rounded-xl hover:bg-p-soft transition-colors shadow-md text-2xl text-center"
            href="/editor/"
            >E</a
          >
          <a
            class="w-10 h-10 border border-p-soft rounded-xl hover:bg-p-soft transition-colors shadow-md text-2xl text-center"
            href="../navigator/"
            >N</a
          >
        </div>
        <details class="avatar dropdown dropdown-end z-20">
          <summary
            class="w-14 h-14 rounded-full bg-white flex items-center justify-center overflow-hidden border-4 border-p-medium shadow-md cursor-pointer hover:scale-105 transition-transform"
          ></summary>

          <ul
            class="menu w-40 dropdown-content rounded-xl bg-white text-sm font-sans text-p-dark shadow-lg border-none"
          >
            <li>
              <a class="hover:bg-p-soft/20 rounded-lg">Profilo</a>
            </li>
            <li>
              <a class="hover:bg-p-soft/20 rounded-lg">Impostazioni</a>
            </li>
            <li>
              <a class="hover:bg-p-soft/20 rounded-lg text-error">Esci</a>
            </li>
          </ul>
        </details>
      </div>
    </header>
    <main class="flex flex-row gap-8">
      <img
        src="https://dummyimage.com/600x400/efefef/a3a3a3.jpg&text=Image+Not+Found"
        alt="Thumbnail not found"
        class="h-9/10 w-1/2"
      />
      <form id="editor-form"></form>
    </main>
    <script src="form.js" type="module" defer></script>
  </body>
</html>
