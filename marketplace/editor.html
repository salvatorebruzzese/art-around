<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
    <link href="../styles.css" rel="stylesheet" type="text/css" />
    <script type="module" src="./editor.js" defer></script>
    <script type="module" src="./shared.js" defer></script>
  </head>

  <body
    x-data="editorState"
    x-init="initByURL()"
    class="flex flex-col items-center max-w-screen bg-white text-p-dark"
  >
    <header class="w-full p-8">
      <quick-nav></quick-nav>
    </header>

    <div class="flex flex-1 xl:w-[80vw] 2xl:w-[66vw]">
      <!--Sidebar-->
      <div class="w-max" x-data="{asideOpen: false}">
        <button
          class="md:hidden fixed bottom-4 left-4 z-50 w-[15vw] h-[15vw] rounded-full bg-[var(--color-p-dark)] text-[var(--color-p-light)] text-2xl"
          @click="asideOpen = !asideOpen"
          aria-label="Open sidebar"
        >
          ☰
        </button>

        <aside
          class="flex flex-col gap-6 fixed top-0 left-0 h-full min-w-[66vw] bg-white z-50 transform transition-transform duration-200 -translate-x-full md:translate-x-0 md:static md:sticky md:top-0 md:min-w-[20%] md:w-64 lg:w-max md:h-screen"
          :class="{ '-translate-x-full': !asideOpen, 'translate-x-0': asideOpen }"
          @keydown.escape.window="open = false"
          x-show="asideOpen || window.innerWidth >= 768"
          x-transition
          x-data="{counter: 1}"
          style="overflow: auto"
        >
          <div class="flex justify-end">
            <button
              class="float-right md:hidden z-50 w-[15vw] h-[15vw] rounded-full bg-[var(--color-p-light)] text-[var(--color-p-dark)] text-2xl"
              @click="asideOpen = false"
            >
              &times;
            </button>
          </div>

          <template
            x-for="(list, idx) in [
                     {
                        name: 'Navigazione',
                        arr: itemNav,
                        get selection(){return Object.keys(items)}

                     },{
                        name: 'Stash',
                        arr:[],
                        get selection() { return Object.keys(items)}

                     }]"
          >
            <div>
              <div
                class="w-full flex justify-between items-center border-b border-p-soft p-4 mb-2"
                x-data="{openSelect:false}"
              >
                <div class="w-max flex gap-6">
                  <button
                    class="shared-button-full-primary w-max pl-2 pr-2"
                    @click="()=>{ openSelect = true}"
                  >
                    Add
                  </button>
                  <button
                    class="shared-button-full-primary w-max pl-2 pr-2"
                    @click="()=>{
                               items[counter] = {
                                   _id: counter,
                                   name: `New item ${counter}`,
                                   itemAuthor: user._id,
                                   tour: tour._id,
                                   explanations: [{level: 'simple', text: '', durationSeconds: 0}, ]
                               }
                               list.arr.push(counter)
                               selectedId=counter
                               counter++;
                           }"
                  >
                    New
                  </button>
                  <h1
                    class="text-2xl text-p-medium font-bold"
                    x-text="list.name"
                  ></h1>
                  <!-- Overlay for '+' item selection -->
                  <template x-if="openSelect">
                    <div
                      x-show="openSelect"
                      class="flex flex-col fixed top-0 left-0 h-full w-full bg-white bg-opacity-80 z-60"
                      x-data="{addList: []}"
                    >
                      <header class="flex justify-between">
                        <h1 class="text-2xl text-p-medium font-bold">
                          Seleziona un item
                        </h1>
                        <button
                          class="float-right w-[15vw] h-[15vw] md:w-10 md:h-10 rounded-full bg-[var(--color-p-light)] text-[var(--color-p-dark)] text-2xl"
                          @click="openSelect = false"
                        >
                          &times;
                        </button>
                      </header>
                      <ul>
                        <template x-for="id in list.selection">
                          <li>
                            <input type="checkbox" @click="addList.push(id)" />
                            <span
                              class="text-left"
                              x-text="items[id].name"
                            ></span>
                          </li>
                        </template>
                      </ul>
                      <button
                        class="shared-button-primary"
                        @click="list.arr = list.arr.concat(addList); openSelect = false"
                      >
                        Ok
                      </button>
                    </div>
                  </template>
                  <!-- End of overlay selection -->
                </div>
              </div>
              <ul class="flex flex-col gap-6">
                <template x-for="id in list.arr">
                  <li
                    class="flex justify-start shared-button-flex-secondary p-2"
                    @click="selectedId = id"
                  >
                    <div class="flex flex-col items-center mr-3">
                      <icon-up-arrow
                        @click="() => {
                           const idx = itemNav.findIndex((i) => i === id);
                            if (idx >= 0) {
                                const [item] = itemNav.splice(idx, 1);
                                itemNav.splice(idx - 1, 0, item);
                            }
                           }"
                      ></icon-up-arrow>
                      <icon-down-arrow
                        @click="() => {
                           const idx = itemNav.findIndex((i) => i === id);
                            if (idx >= 0) {
                                const [item] = itemNav.splice(idx, 1);
                                itemNav.splice(idx + 1, 0, item);
                            }
                           }"
                      >
                      </icon-down-arrow>
                    </div>
                    <span class="text-left" x-text="items[id].name"></span>

                    <div style="margin-left: auto">
                      <div x-data="{dopen:false}" class="dropdown dropdown-end">
                        <button
                          @click.stop="dopen = !dopen"
                          class="btn btn-sm btn-circle bg-white/80 hover:bg-white text-p-dark border-none shadow-md backdrop-blur-sm focus:outline-none list-none"
                        >
                          <icon-three-dots></icon-three-dots>
                        </button>
                        <div
                          x-show="dopen"
                          x-transition
                          @click.outside="dopen = false"
                        >
                          <ul class="nav-dropdown-menu dropdown-end p-2">
                            <li>
                              <a
                                class="shared-button-flex-secondary shadow-none"
                                >Unlink</a
                              >
                            </li>
                            <li>
                              <a class="shared-button-flex-warning shadow-none"
                                >Elimina</a
                              >
                            </li>
                          </ul>
                        </div>
                      </div>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </aside>

        <!-- Overlay (mobile only, appears when sidebar open) -->
        <div
          x-show="asideOpen"
          class="fixed inset-0 z-40 md:hidden"
          @click="asideOpen = false"
          x-transition.opacity
          style="background-color: rgba(0, 0, 0, 0.5)"
        ></div>
      </div>
      <!-- Main content -->
      <main
        class="flex-1 md:mr-6 md:ml-6"
        x-data="{
              tabs: [
                {name: 'Edit Item', id:'edit_item', active: 'bg-blue-100  rounded-t-3xl border-t border-l border-p-soft', inactive: 'bg-white'},
                {name: 'Edit Tour', id:'edit_tour', active: 'bg-blue-100 rounded-t-3xl border-t border-r border-p-soft', inactive:'bg-white'},
              ],
              activeTab: 'edit_item',
              init() {
                const params = new URLSearchParams(window.location.search);
                if (params.has('tab'))
                    this.activeTab = params.get('tab');
              },
            }"
      >
        <header id="tab_select" class="w-full flex min-h-10">
          <template x-for="tab in tabs">
            <button
              :id="tab.id"
              class="flex-1"
              :class="tab.id == activeTab ? tab.active : tab.inactive "
              @click="activeTab = tab.id"
              x-text="tab.name"
            ></button>
          </template>
        </header>
        <section
          x-show="activeTab == 'edit_item'"
          class="w-full rounded-tr-3xl rounded-br-3xl rounded-bl-3xl shadow-sm border border-p-soft"
        >
          <template x-if="selectedId && items[selectedId] ">
            <div class="w-full flex flex-col p-4">
              <div class="border-b border-p-soft p-4 mb-2">
                <h1 class="text-2xl text-p-medium font-bold">Modifica Item</h1>
              </div>
              <form
                x-data="{get formData(){return items[selectedId]}}"
                @submit.prevent="saveItem(formData)"
                class="grid grid-cols-1 md:grid-cols-2 text-p-medium md:p-8 gap-6"
              >
                <div class="flex flex-col row-span-6">
                  <figure>
                    <img
                      :src="formData.image ? '/api/assets/'+formData.image : ''"
                      :alt="formData.imageAlt ? formData.imageAlt : 'Item image'"
                    />
                  </figure>
                </div>
                <div class="flex flex-col gap-1 w-full">
                  <label class="text-sm font-medium">Nome dell'item</label>
                  <input
                    type="text"
                    x-model="formData.name"
                    required
                    class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium transition-shadow"
                  />
                </div>
                <div class="flex flex-col gap-1 w-full">
                  <label class="text-sm font-medium">Licenza d'uso</label>
                  <input
                    type="text"
                    x-model="formData.license"
                    class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
                  />
                </div>
                <fieldset
                  x-data="
                            {
                                activeTab: null,
                          init(){
                            this.activeTab = formData.explanations[0]
                          console.log(formData.explanations, this.activeTab)
                          }
                            }
                            "
                >
                  <header
                    class="flex gap-2"
                    x-data="{newExpOverlay: false, newExpInput: ''}"
                  >
                    <template x-for="exp in formData.explanations">
                      <div>
                        <label
                          class="flex-1"
                          :class="activeTab === exp ? 'bg-blue-100' : ''"
                          x-text="exp.level"
                          @click="activeTab = exp"
                        >
                        </label>
                        <span x-data="{overlay:false}" @click="overlay=true">
                          &times;

                          <template x-if="overlay">
                            <div
                              class="fixed inset-0 flex items-center justify-center z-50"
                              style="background-color: rgba(0, 0, 0, 0.8)"
                            >
                              <div
                                class="bg-white rounded-lg p-6 w-screen max-w-full md:w-[50vw] lg:w-[30vw] shadow-xl flex flex-col items-center"
                              >
                                <p>Sei sicuro?</p>
                                <div
                                  class="flex space-x-4 w-full justify-center"
                                >
                                  <button
                                    type="button"
                                    class="shared-button-flex-primary"
                                    @click.stop="overlay = false;
                                            formData.explanations = formData.explanations.filter(item => item.level !== exp.level);"
                                  >
                                    Ok
                                  </button>
                                  <button
                                    type="button"
                                    class="shared-button-flex-secondary"
                                    @click.stop="overlay = false"
                                  >
                                    Cancel
                                  </button>
                                </div>
                              </div>
                            </div>
                          </template>
                        </span>
                      </div>
                    </template>
                    <button
                      type="button"
                      class="w-6"
                      @click.stop="newExpOverlay = true"
                    >
                      +
                    </button>
                    <!-- Overlay for new explanation -->
                    <template x-if="newExpOverlay">
                      <div
                        class="fixed inset-0 flex items-center justify-center z-50"
                        style="background-color: rgba(0, 0, 0, 0.8)"
                      >
                        <div
                          class="bg-white rounded-lg p-6 w-screen max-w-full md:w-[50vw] lg:w-[30vw] shadow-xl flex flex-col items-center"
                        >
                          <input
                            type="text"
                            x-model="newExpInput"
                            class="mb-4 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Enter text..."
                          />
                          <div class="flex space-x-4 w-full justify-center">
                            <button
                              type="button"
                              class="shared-button-flex-primary"
                              @click="newExpOverlay = false; formData.explanations.push({level: newExpInput, text: ''})"
                            >
                              Ok
                            </button>
                            <button
                              type="button"
                              class="shared-button-flex-secondary"
                              @click="newExpOverlay = false"
                            >
                              Cancel
                            </button>
                          </div>
                        </div>
                      </div>
                    </template>
                  </header>
                  <template x-for="exp in formData.explanations">
                    <div
                      x-show="exp === activeTab"
                      class="flex flex-col gap-1 w-full"
                    >
                      <label class="text-sm font-medium">Testo</label>
                      <textarea
                        x-model="exp.text"
                        required
                        rows="4"
                        class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium resize-none"
                      ></textarea>
                      <label> Durata(s) </label>
                      <input
                        x-model.number="exp.durationSeconds"
                        type="number"
                        min="0"
                        max="3600"
                        step="1"
                      />
                    </div>
                  </template>
                </fieldset>
                <button
                  type="submit"
                  class="shared-button-full-primary"
                  x-text="typeof formData._id !== 'number'? 'Salva Modifiche':'Crea'"
                ></button>
              </form>
            </div>
          </template>
        </section>
        <section x-show="activeTab == 'edit_tour'">
          <button
            class="shared-button-full-primary"
            @click="saveItemsAndTour()"
          >
            Salva tour
          </button>
        </section>
      </main>
    </div>
  </body>
  <script>
    customElements.define(
      'icon-three-dots',
      class extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4z"/>
        </svg>
      `
        }
      },
    )

    customElements.define(
      'icon-up-arrow',
      class extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="mb-2 shared-button-flex-secondary"
                      >
                        <path d="M12 5v14M5 12l7-7 7 7" />
                      </svg>
`
        }
      },
    )
    customElements.define(
      'icon-down-arrow',
      class extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="shared-button-flex-secondary"
                      >
                        <path d="M12 19V5M19 12l-7 7-7-7" />
                      </svg>
`
        }
      },
    )
  </script>
</html>
