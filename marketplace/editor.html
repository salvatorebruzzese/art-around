<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>

    <link href="../styles.css" rel="stylesheet" type="text/css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body
    class="p-6 md:p-10 min-h-screen font-sans text-p-dark"
    x-data="editorState()"
  >
    <!-- Header Navigation -->

    <header
      class="flex flex-wrap justify-end items-center gap-6 mb-10 w-full max-w-7xl mx-auto"
    >
      <div class="flex flex-row justify-center items-center gap-3">
        <div class="flex items-center gap-2">
          <a
            class="nav-icon-link group !p-0 !border-none shadow-sm rounded-xl hover:!bg-transparent"
            href="../home/"
          >
            <svg
              width="48"
              height="48"
              viewBox="0 0 48 48"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                width="48"
                height="48"
                rx="12"
                fill="white"
                stroke="none"
                class="group-hover:fill-[var(--color-p-medium)] transition-colors"
              />
              <path
                d="M24 12 L10 24 H14 V36 H22 V28 H26 V36 H34 V24 H38 Z"
                fill="var(--color-p-medium)"
                class="group-hover:fill-[var(--color-p-light)] transition-colors"
              />
            </svg>
          </a>
          <a
            class="nav-icon-link group !p-0 !border-none shadow-sm rounded-xl hover:!bg-transparent"
            href="/marketplace/"
          >
            <svg
              width="48"
              height="48"
              viewBox="0 0 48 48"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                width="48"
                height="48"
                rx="12"
                fill="white"
                stroke="none"
                class="group-hover:fill-[var(--color-p-medium)] transition-colors"
              />
              <path
                d="M12 20 L15 12 H33 L36 20 V24 H34 V36 H14 V24 H12 V20 Z M18 24 V34 H30 V24 H18 Z M16 18 H32 L30 14 H18 L16 18 Z"
                fill="var(--color-p-medium)"
                class="group-hover:fill-[var(--color-p-light)] transition-colors"
              />
            </svg>
          </a>
          <a
            class="nav-icon-link group !p-0 !border-none shadow-sm rounded-xl hover:!bg-transparent"
            href="/editor/"
          >
            <svg
              width="48"
              height="48"
              viewBox="0 0 48 48"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                width="48"
                height="48"
                rx="12"
                fill="white"
                stroke="none"
                class="group-hover:fill-[var(--color-p-medium)] transition-colors"
              />
              <path
                transform="translate(24, 24) scale(0.85) translate(-24, -24)"
                d="M14 8 H26 L36 18 V38 A2 2 0 0 1 34 40 H14 A2 2 0 0 1 12 38 V10 A2 2 0 0 1 14 8 Z M26 11 V18 H33 L26 11 Z M18 22 V24 H30 V22 H18 Z M18 28 V30 H30 V28 H18 Z M18 34 V36 H26 V34 H18 Z"
                fill="var(--color-p-medium)"
                class="group-hover:fill-[var(--color-p-light)] transition-colors"
              />
            </svg>
          </a>
          <a
            class="nav-icon-link group !p-0 !border-none shadow-sm rounded-xl hover:!bg-transparent"
            href="../navigator/"
          >
            <svg
              width="48"
              height="48"
              viewBox="0 0 48 48"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                width="48"
                height="48"
                rx="12"
                fill="white"
                stroke="none"
                class="group-hover:fill-[var(--color-p-medium)] transition-colors"
              />
              <path
                d="M24 8 A16 16 0 1 0 24 40 A16 16 0 0 0 24 8 Z M24 12 A12 12 0 1 1 24 36 A12 12 0 0 1 24 12 Z M18 30 L22 20 L32 16 L28 26 L18 30 Z M25.5 23.5 A1.5 1.5 0 1 0 25.5 20.5 A1.5 1.5 0 0 0 25.5 23.5 Z"
                fill="var(--color-p-medium)"
                class="group-hover:fill-[var(--color-p-light)] transition-colors"
              />
            </svg>
          </a>
        </div>

        <details class="avatar dropdown dropdown-end z-20">
          <summary
            class="nav-avatar-trigger list-none cursor-pointer"
          ></summary>
          <ul class="nav-dropdown-menu">
            <li>
              <a
                class="shared-button-flex-secondary shadow-none"
                href="../profile"
                >Profilo</a
              >
            </li>
            <li>
              <a
                class="shared-button-flex-warning shadow-none mt-2"
                href="../home"
                >Esci</a
              >
            </li>
          </ul>
        </details>
      </div>
    </header>

    <!-- Main Content -->
    <main
      class="grid lg:grid-cols-2 gap-10 items-start w-full max-w-7xl mx-auto"
    >
      <!-- Media Preview -->
      <figure
        class="w-full aspect-video lg:aspect-square bg-white rounded-3xl overflow-hidden shadow-sm border border-p-soft"
      >
        <img
          src="https://dummyimage.com/800x800/efefef/a3a3a3.jpg&text=Image+Preview"
          alt="Thumbnail"
          class="object-cover w-full h-full"
        />
      </figure>

      <!-- Data Form -->
      <form
        @submit.prevent="submitForm"
        class="flex flex-col text-p-medium gap-5 bg-white p-8 rounded-3xl shadow-sm border border-p-soft"
      >
        <div class="border-b border-p-soft pb-4 mb-2">
          <h1 class="text-2xl text-p-medium font-bold">Modifica Item</h1>
        </div>

        <div class="flex flex-col gap-1 w-full">
          <label class="text-sm font-medium">Nome dell'item</label>
          <input
            type="text"
            x-model="formData.name"
            required
            class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium transition-shadow"
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex flex-col gap-1 w-full">
            <label class="text-sm font-medium">Tipo di item</label>
            <select
              x-model="formData.itemType"
              required
              class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
            >
              <option value="artist">Artista</option>
              <option value="style">Stile</option>
              <option value="technique">Tecnica</option>
              <option value="artwork">Opera</option>
              <option value="other">Altro</option>
            </select>
          </div>

          <div class="flex flex-col gap-1 w-full">
            <label class="text-sm font-medium">Tour</label>
            <input
              type="text"
              x-model="formData.tour"
              required
              class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
            />
          </div>
        </div>

        <div class="flex flex-col gap-1 w-full">
          <label class="text-sm font-medium">Licenza d'uso</label>
          <input
            type="text"
            x-model="formData.license"
            class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
          />
        </div>

        <!-- Mongoose Sub-schema Mapping -->
        <fieldset
          class="border border-p-soft p-5 rounded-2xl bg-p-soft/20 mt-2"
        >
          <legend class="font-semibold bg-p-light rounded-lg">
            Spiegazione
          </legend>
          <div class="flex flex-col gap-4 mt-2">
            <div class="flex flex-col gap-1 w-full md:w-1/2">
              <label class="text-sm font-medium">Livello</label>
              <select
                x-model="formData.explanations[0].level"
                required
                class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
              >
                <option value="simple">Semplice</option>
                <option value="normal">Normale</option>
                <option value="advanced">Avanzato</option>
              </select>
            </div>
            <div class="flex flex-col gap-1 w-full">
              <label class="text-sm font-medium">Testo</label>
              <textarea
                x-model="formData.explanations[0].text"
                required
                rows="4"
                class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium resize-none"
              ></textarea>
            </div>
          </div>
        </fieldset>

        <button type="submit" class="shared-form-button">
          Salva Modifiche
        </button>
      </form>
    </main>
  </body>
</html>
