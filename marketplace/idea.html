<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Draggable Dots (Swap) - Alpine.js + Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div
      x-data="draggableDots()"
      class="w-[600px] h-32 flex items-center justify-center relative select-none"
      @mousemove.window="dragging && onDrag($event)"
      @mouseup.window="dragging && endDrag()"
    >
      <!-- Line -->
      <div class="absolute top-1/2 left-0 w-full h-1 bg-gray-300"></div>
      <!-- Dots -->
      <template x-for="(dot, idx) in dots" :key="dot">
        <div
          class="absolute w-8 h-8 rounded-full flex items-center justify-center border-4 font-bold text-white transition-all duration-200 shadow-lg cursor-grab"
          :class="{
          'bg-blue-500 border-white': draggingDot !== idx,
          'bg-yellow-400 border-yellow-300 scale-110 z-50 shadow-2xl': draggingDot === idx
        }"
          :style="dotStyle(idx)"
          x-text="dot + 1"
          @mousedown.prevent="startDrag(idx, $event)"
        ></div>
      </template>
    </div>

    <script>
      function draggableDots() {
        return {
          dots: [0, 1, 2, 3, 4, 5],
          dragging: false,
          draggingDot: null,
          dragOffsetX: 0,
          mouseX: 0,
          PAD: 40,
          LINE_WIDTH: 600,
          DOT_SIZE: 32,
          startDrag(idx, e) {
            this.dragging = true
            this.draggingDot = idx
            const dotRect = e.target.getBoundingClientRect()
            this.dragOffsetX = e.clientX - (dotRect.left + this.DOT_SIZE / 2)
            this.mouseX = e.clientX
          },
          onDrag(e) {
            if (!this.dragging || this.draggingDot === null) return

            this.mouseX = e.clientX
            const container = document.querySelector('[x-data]')
            const cRect = container.getBoundingClientRect()
            // Calculate limited x within line
            let relX = this.mouseX - cRect.left - this.dragOffsetX
            relX = Math.max(
              this.PAD,
              Math.min(this.LINE_WIDTH - this.PAD, relX),
            )

            // Compute swap slot
            let slot = Math.round(
              (relX - this.PAD) /
                ((this.LINE_WIDTH - 2 * this.PAD) / (this.dots.length - 1)),
            )
            slot = Math.max(0, Math.min(this.dots.length - 1, slot))

            if (slot !== this.draggingDot) {
              // Actually swap the array positions (classic swap)
              const temp = this.dots[this.draggingDot]
              this.dots.splice(this.draggingDot, 1)
              this.dots.splice(slot, 0, temp)
              this.draggingDot = slot
            }
          },
          endDrag() {
            this.dragging = false
            this.draggingDot = null
          },
          dotStyle(idx) {
            if (this.dragging && this.draggingDot === idx && this.mouseX) {
              const container = document.querySelector('[x-data]')
              const cRect = container.getBoundingClientRect()
              let relX = this.mouseX - cRect.left - this.dragOffsetX
              relX = Math.max(
                this.PAD,
                Math.min(this.LINE_WIDTH - this.PAD, relX),
              )
              return `top: 50%; left: ${relX}px; transform: translate(-50%, -50%);`
            }
            const x =
              this.PAD +
              idx * ((this.LINE_WIDTH - 2 * this.PAD) / (this.dots.length - 1))
            return `top: 50%; left: ${x}px; transform: translate(-50%, -50%);`
          },
        }
      }
    </script>
  </body>
</html>
