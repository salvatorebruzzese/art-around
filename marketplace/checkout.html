<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>

    <link href="../styles.css" rel="stylesheet" type="text/css" />
    <script type="module" src="./checkout.js" defer></script>
  </head>
  <body
    class="p-6 md:p-10 min-h-screen font-sans text-p-dark"
    x-data="checkout"
  >
    <!-- Main Content -->
    <main
      class="grid lg:grid-cols-2 gap-10 items-start w-full max-w-7xl mx-auto"
    >
      <!-- Order Summary Card -->
      <section
        class="flex flex-col text-p-medium gap-4 bg-white p-8 rounded-3xl shadow-sm border border-p-soft"
      >
        <h1
          class="text-2xl text-p-medium font-bold border-b border-p-soft pb-4"
        >
          Carrello
        </h1>

        <div
          class="flex flex-col sm:flex-row justify-center items-center gap-4 border border-p-soft bg-p-soft/20 rounded-2xl p-5 overflow-auto"
        >
          <fieldset
            class="flex flex-col gap-3 w-full p-5 rounded-2xl bg-p-light mt-2"
            id="visits-container"
          >
            <div id="visits-list" class="flex flex-col gap-3 w-full">
              <template x-for="tour in tours" :key="tour._id">
                <div
                  class="flex justify-between items-center text-md text-p-dark gap-2 max-w-3xl"
                >
                  <figure
                    class="aspect-square w-16 flex-shrink-0 rounded-2xl overflow-hidden"
                  >
                    <img
                      :src="'/api/assets/' + tour.thumbnail"
                      :alt="tour.name"
                      class="object-cover w-full h-full"
                    />
                  </figure>
                  <span x-text="tour.name"></span>
                  <span
                    class="shrink-0"
                    x-text="'€ ' + Number(tour.price).toFixed(2)"
                  ></span>
                </div>
              </template>
            </div>

            <!-- Totale -->
            <div
              class="flex justify-between items-center text-md font-bold text-p-dark border-t border-p-soft pt-2"
            >
              <span>Totale</span>
              <span x-text="'€ ' + Number(total).toFixed(2)"></span>
            </div>
          </fieldset>
        </div>
      </section>

      <!-- Payment Form -->
      <form
        @submit.prevent="updateUser()"
        class="flex flex-col text-p-medium gap-5 bg-white p-8 rounded-3xl shadow-sm border border-p-soft"
      >
        <div class="border-b border-p-soft pb-4 mb-2">
          <h2 class="text-2xl text-p-medium font-bold">Pagamento</h2>
        </div>

        <!-- Personal Info -->
        <div class="flex flex-col gap-1 w-full">
          <label class="text-sm font-medium">Nome Completo</label>
          <input
            type="text"
            required
            placeholder="Mario Rossi"
            class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium transition-shadow"
          />
        </div>

        <div class="flex flex-col gap-1 w-full">
          <label class="text-sm font-medium">Email per la conferma</label>
          <input
            type="email"
            required
            placeholder="mario.rossi@example.com"
            class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium transition-shadow"
          />
        </div>

        <!-- Payment Details Fieldset -->
        <fieldset
          class="border border-p-soft p-5 rounded-2xl bg-p-soft/20 mt-2 flex flex-col gap-4"
        >
          <legend class="font-semibold bg-p-light rounded-lg px-2">
            Metodo di Pagamento
          </legend>

          <div class="flex flex-col gap-1 w-full">
            <label class="text-sm font-medium">Numero Carta</label>
            <input
              type="text"
              required
              maxlength="19"
              placeholder="1234 5678 9012 3456"
              class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
            />
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex flex-col gap-1 w-full">
              <label class="text-sm font-medium">Scadenza (MM/AA)</label>
              <input
                type="text"
                required
                placeholder="12/28"
                maxlength="5"
                class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
              />
            </div>

            <div class="flex flex-col gap-1 w-full">
              <label class="text-sm font-medium">CVV</label>
              <input
                type="password"
                required
                maxlength="4"
                placeholder="123"
                class="w-full px-4 py-2 rounded-xl border border-p-soft bg-white text-p-dark focus:outline-none focus:ring-2 focus:ring-p-medium"
              />
            </div>
          </div>
        </fieldset>

        <button
          type="submit"
          class="shared-button-full-primary mt-2"
          @click.prevent="updateUser()"
        >
          Conferma e Paga
        </button>
      </form>
    </main>
  </body>
</html>
