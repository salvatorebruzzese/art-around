<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace</title>
    <link href="../styles.css" rel="stylesheet" type="text/css" />
    <script type="module" src="./marketplace.js" defer></script>
    <script type="module" src="./shared.js" defer></script>
  </head>
  <body
    class="flex justify-center h-screen bg-p-light text-p-dark font-serif selection:bg-p-soft overflow-y-auto"
  >
    <main
      x-data="marketplace()"
      class="w-full p-4 sm:p-0 flex flex-col mx-4 mt-12 sm:max-w-[70%]"
    >
      <!-- HEADER CON FILTRI E ICONE SVG -->
      <header
        class="flex flex-col justify-center items-center mb-10 gap-6 font-sans"
      >
        <!-- SVG Navigation & User Dropdown -->
        <div class="flex flex-row justify-center items-center gap-3">
          <quick-nav></quick-nav>
        </div>

        <!-- Controls: Search, Select Museo e Toggle -->
        <div
          class="flex flex-col sm:flex-row sm:flex-wrap w-full flex-1 min-w-[300px] gap-6 justify-center items-center"
        >
          <!-- Search Bar -->
          <div class="relative w-full sm:flex-1 max-w-lg min-w-[250px]">
            <input
              x-model="filters.search"
              type="text"
              placeholder="Cerca..."
              class="input input-bordered rounded-full w-full pr-12 border-p-soft bg-white text-p-dark placeholder-p-medium focus:border-p-medium focus:ring-2 focus:ring-p-soft focus:outline-none transition-all shadow-sm"
            />
            <button
              type="button"
              aria-label="Submit search"
              class="absolute right-2 top-0 bottom-0 my-auto flex items-center justify-center w-10 h-10 rounded-full text-p-medium hover:bg-p-soft/30 hover:text-p-dark active:scale-95 transition-all outline-none cursor-pointer focus:ring-2 focus:ring-p-medium"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </button>
          </div>

          <!-- Dropdown Musei -->
          <div
            :class="{ 'text-p-soft rounded-full': !filters.museum }"
            class="w-full md:w-56"
          >
            <select
              x-model="filters.museum"
              class="select select-bordered rounded-full w-full border-p-soft bg-white text-p-dark focus:border-p-medium focus:ring-2 focus:ring-p-soft focus:outline-none font-medium shadow-sm cursor-pointer transition-all"
            >
              <option value="">Tutti i musei</option>
              <template x-for="museum in museums" :key="museum._id">
                <option :value="museum._id" x-text="museum.name"></option>
              </template>
            </select>
          </div>

          <!-- Switch Toggle (Visibile solo se un museo è selezionato, e si è loggati) -->
          <div class="flex flex-col gap-4 sm:flex-row">
            <div
              id="toggle-switch"
              x-transition
              x-show="user"
              class="flex items-center border border-p-soft rounded-full h-12 p-1 bg-white shadow-sm w-64"
            >
              <button
                x-data
                @click="view = 'tour'"
                :class="view === 'tour'
                ? 'flex-1 h-full rounded-full bg-p-medium text-white font-semibold text-sm transition-all duration-150 active:scale-95 shadow-sm cursor-pointer'
                : 'flex-1 h-full rounded-full bg-transparent text-p-medium hover:bg-p-soft/20 font-semibold text-sm transition-all duration-150 active:scale-95 cursor-pointer'"
              >
                TOURS
              </button>
              <button
                x-data
                @click="view = 'item'"
                :class="view === 'item'
                ? 'flex-1 h-full rounded-full bg-p-medium text-white font-semibold text-sm transition-all duration-150 active:scale-95 shadow-sm cursor-pointer'
                : 'flex-1 h-full rounded-full bg-transparent text-p-medium hover:bg-p-soft/20 font-semibold text-sm transition-all duration-150 active:scale-95 cursor-pointer'"
              >
                ITEM
              </button>
            </div>
            <!-- purchased tours -->
            <div
              x-data
              id="toggle-purchased"
              x-show="user && view == 'tour'"
              x-transition
              class="flex items-center border border-p-soft rounded-full h-12 p-1 bg-white shadow-sm w-64"
            >
              <button
                @click="filters.purchased = false"
                :class="!filters.purchased
                ? 'flex-1 h-full rounded-full bg-p-medium text-white font-semibold text-sm transition-all duration-150 active:scale-95 shadow-sm cursor-pointer'
                : 'flex-1 h-full rounded-full bg-transparent text-p-medium hover:bg-p-soft/20 font-semibold text-sm transition-all duration-150 active:scale-95 cursor-pointer'"
              >
                ALL
              </button>
              <button
                @click="filters.purchased = true"
                :class="filters.purchased
                ? 'flex-1 h-full rounded-full bg-p-medium text-white font-semibold text-sm transition-all duration-150 active:scale-95 shadow-sm cursor-pointer'
                : 'flex-1 h-full rounded-full bg-transparent text-p-medium hover:bg-p-soft/20 font-semibold text-sm transition-all duration-150 active:scale-95 cursor-pointer'"
              >
                PURCHASED
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- GRIGLIA DI RENDER CARDS -->
      <div
        id="cards-container"
        class="pb-4 transition-all duration-300"
        :class="{ 'pb-32': cartTours.length > 0 }"
      >
        <!-- Item card -->
        <div
          x-show="view == 'item'"
          class="w-full flex flex-col sm:grid sm:grid-cols-[repeat(auto-fit,minmax(280px,0.5fr))] justify-center gap-8"
        >
          <template x-for="itemMeta in filteredItems" :key="itemMeta._id">
            <div
              x-data="{ item: null }"
              x-init="fetch('/api/items/' + itemMeta._id)
                        .then(r => r.json())
                        .then(data => { item = data })"
            >
              <template x-if="!item">
                <p>Error loading</p>
              </template>
              <template x-if="item">
                <div :class="cardDecorator">
                  <div
                    class="h-full flex-1 relative bg-gradient-to-br from-p-light to-p-soft/20"
                  >
                    <img
                      x-bind:src="'/api/assets/'+item.image"
                      alt="Thumbnail not found"
                      class="absolute inset-0 w-full h-full object-cover mix-blend-multiply"
                    />

                    <!-- Dropdown Menu Tre Punti -->
                    <!-- TODO: refactor into template -->
                    <div class="absolute top-3 right-3 z-10">
                      <div x-data="{open:false}" class="dropdown dropdown-end">
                        <button
                          @click="open = !open"
                          class="btn btn-sm btn-circle bg-white/80 hover:bg-white text-p-dark border-none shadow-md backdrop-blur-sm focus:outline-none list-none"
                        >
                          <svg
                            class="w-5 h-5"
                            fill="currentColor"
                            viewBox="0 0 20 20"
                          >
                            <path
                              d="M10 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4z"
                            />
                          </svg>
                        </button>
                        <div
                          x-show="open"
                          x-transition
                          @click.outside="open = false"
                        >
                          <ul class="nav-dropdown-menu dropdown-end p-2">
                            <li>
                              <a
                                class="shared-button-flex-secondary shadow-none"
                                >Condividi</a
                              >
                            </li>
                            <li>
                              <a class="shared-button-flex-warning shadow-none"
                                >Elimina</a
                              >
                            </li>
                          </ul>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div
                    class="h-36 bg-p-soft/20 flex flex-col justify-center gap-4 px-6 border-t text-p-dark border-p-soft/50"
                  >
                    <div class="flex flex-col font-sans">
                      <h1
                        class="text-2xl text-p-medium truncate"
                        x-text="item.name"
                      ></h1>
                      <h2
                        x-init="init"
                        x-data="{
                            tourName: '',
                            async init() {this.tourName = (await fetch('/api/tours/'+item.tour).then(r => r.json())).name},
                          }"
                        class="text-md text-p-medium/50 truncate"
                        x-text="tourName"
                      ></h2>
                    </div>
                    <div class="flex gap-4">
                      <a
                        class="shared-button-full-primary"
                        :href="'./' + item.tour + '?item=' + item._id"
                      >
                        Apri
                      </a>
                      <a
                        class="shared-button-full-secondary"
                        :href="'/marketplace/editor/' + item.tour + '?item=' + item._id"
                      >
                        Modifica
                      </a>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
        <!-- Tour card -->
        <div
          x-data
          x-show="view == 'tour'"
          class="w-full flex flex-col sm:grid sm:grid-cols-[repeat(auto-fit,minmax(280px,0.5fr))] justify-center gap-8"
        >
          <template
            x-data
            x-show="view == 'tour'"
            x-for="tour in filteredTours"
            :key="tour._id"
          >
            <div :class="cardDecorator">
              <div
                class="h-full flex-1 relative bg-gradient-to-br from-p-light to-p-soft/20"
              >
                <img
                  x-bind:src="'/api/assets/'+tour.thumbnail"
                  alt="Thumbnail not found"
                  class="absolute inset-0 w-full h-full object-cover mix-blend-multiply"
                />

                <!-- Dropdown Menu Tre Punti -->
                <div class="absolute top-3 right-3 z-10">
                  <!-- The dropdown should only render if the user is logged in or owns the tour -->
                  <div
                    x-data="{open:false}"
                    x-show="user
                           &&( user.purchasedTours.includes(tour._id)
                           || user.authoredTours.includes(tour._id))"
                    class="dropdown dropdown-end"
                  >
                    <button
                      @click="open = !open"
                      class="btn btn-sm btn-circle bg-white/80 hover:bg-white text-p-dark border-none shadow-md backdrop-blur-sm focus:outline-none list-none"
                    >
                      <svg
                        class="w-5 h-5"
                        fill="currentColor"
                        viewBox="0 0 20 20"
                      >
                        <path
                          d="M10 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4z"
                        />
                      </svg>
                    </button>
                    <div
                      x-show="open"
                      x-transition
                      @click.outside="open = false"
                    >
                      <ul class="nav-dropdown-menu dropdown-end p-4">
                        <li>
                          <a class="shared-button-flex-secondary shadow-none"
                            >Modifica</a
                          >
                        </li>
                        <li>
                          <a class="shared-button-flex-secondary shadow-none"
                            >Clona</a
                          >
                        </li>
                        <li>
                          <a class="shared-button-flex-secondary shadow-none"
                            >Condividi</a
                          >
                        </li>
                        <li>
                          <a class="shared-button-flex-warning shadow-none"
                            >Elimina</a
                          >
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
              <div
                class="h-36 bg-p-soft/20 flex flex-col justify-center gap-4 px-6 border-t text-p-dark border-p-soft/50"
              >
                <div class="flex flex-col font-sans">
                  <h1
                    class="text-2xl text-p-medium truncate"
                    x-text="tour.name"
                  ></h1>
                  <h2
                    x-init="init"
                    x-data="{
                            museumName: '',
                            async init() {this.museumName = (await fetch('/api/museums/'+tour.museum).then(r => r.json())).name},
                          }"
                    class="text-md text-p-medium/50 truncate"
                    x-text="museumName"
                  ></h2>
                </div>
                <div class="flex gap-4">
                  <a
                    x-show="hasAccess(tour._id)"
                    :href="'/marketplace/' + tour._id"
                    class="shared-button-full-secondary"
                  >
                    Apri
                  </a>

                  <button
                    x-show="!hasAccess(tour._id)"
                    @click="window.history.pushState({}, '', '/marketplace/preview/' + tour._id); showPreview = true; currPreview = tour;"
                    class="shared-button-full-secondary"
                  >
                    Anteprima
                  </button>
                  <button
                    class="shared-button-full-primary"
                    x-show="user && !user?.purchasedTours.includes(tour._id)
                           && !user?.authoredTours.includes(tour._id)"
                    @click="if (!cartTours.includes(tour._id)) cartTours.push(tour._id);"
                  >
                    <span class="mr-1">Aggiungi</span>
                    <!-- Shopping cart icon -->
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="inline-block fill-current align-middle ml-1"
                    >
                      <circle cx="9" cy="21" r="1"></circle>
                      <circle cx="20" cy="21" r="1"></circle>
                      <path
                        d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
                      ></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Wrapper Modale Centrato con Overlay / Fade -->
      <div
        x-show="showPreview"
        x-transition.opacity.duration.300ms
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-p-dark/50 backdrop-blur-sm overflow-y-auto"
        x-init="if (window.location.pathname.startsWith('/marketplace/preview/')) { showPreview = true;}"
        @popstate.window="showPreview = window.location.pathname.startsWith('/marketplace/preview/');"
      >
        <!-- Contenitore Interno della Modale -->

        <div
          @click.outside="window.history.pushState({}, '', '/marketplace/'); showPreview = false;"
          class="relative w-full max-w-4xl bg-white rounded-3xl shadow-2xl border border-p-soft p-6 my-auto"
        >
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Image Container -->
            <figure
              class="w-full aspect-square rounded-2xl overflow-hidden justify-self-center self-center bg-p-soft/20"
            >
              <template x-if="currPreview">
                <img
                  class="object-cover w-full h-full"
                  :src="'/api/assets/' + currPreview?.thumbnail"
                  :alt="currPreview?.name"
                />
              </template>
            </figure>

            <div class="flex flex-col font-sans justify-start space-y-4">
              <h1
                class="text-2xl md:text-4xl font-bold text-p-medium"
                x-text="currPreview?.name"
              ></h1>
              <h2
                x-data="{ museumName: '' }"
                x-init="$watch('showPreview', async (value) => {
                  if (value && currPreview?.museum) {
                    const res = await fetch('/api/museums/' + currPreview.museum);
                    const data = await res.json();
                    museumName = data.name;
                  }
                })"
                x-text="museumName"
                class="text-md text-p-medium/50 truncate"
              ></h2>
              <p
                class="text-p-dark leading-relaxed"
                x-text="currPreview?.description"
              ></p>
            </div>
          </div>

          <!-- Bottone Chiudi integrato -->
          <div class="flex justify-end mt-6">
            <button
              class="shared-button-fit-secondary px-6"
              @click="window.history.pushState({}, '', '/marketplace/'); showPreview = false;"
            >
              Torna indietro
            </button>
          </div>
        </div>
      </div>

      <!-- Floating Cart Box Overlay -->
      <div
        x-show="cartTours.length > 0"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-8"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 translate-y-8"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-11/12 max-w-2xl bg-white/70 backdrop-blur-md border border-p-soft/60 rounded-2xl p-4 shadow-xl flex items-center justify-between gap-4"
      >
        <!-- List of Cart Items -->
        <div class="flex items-center gap-2 overflow-x-auto py-1">
          <template x-for="(tourId, index) in cartTours" :key="tourId">
            <div
              x-data="{ itemDetail: null }"
              x-init="fetch('/api/tours/' + tourId).then(r => r.json()).then(data => itemDetail = data)"
              class="flex items-center gap-2 bg-p-light/80 px-3 py-1.5 rounded-xl border border-p-soft/40 flex-shrink-0 text-sm font-sans"
            >
              <span
                x-text="itemDetail ? itemDetail.name : 'Caricamento...'"
                class="font-medium text-p-dark truncate max-w-[120px]"
              ></span>
              <button
                @click="cartTours.splice(index, 1)"
                class="text-p-medium/60 hover:text-p-dark transition-colors font-bold cursor-pointer ml-1"
                aria-label="Rimuovi elemento"
              >
                &times;
              </button>
            </div>
          </template>
        </div>

        <!-- Cart Action Button -->
        <div class="flex items-center gap-3">
          <a
            :href="'/marketplace/checkout/?tours=' + cartTours.join(',')"
            class="shared-button-flex-primary px-4 shadow-md"
          >
            Carrello
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
