<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace</title>

    <link href="../styles.css" rel="stylesheet" type="text/css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body
    class="flex h-screen bg-p-light text-p-dark font-serif selection:bg-p-soft"
  >
    <main
      x-data="marketplaceComponent"
      x-init="init()"
      class="flex-1 flex flex-col p-10 overflow-y-auto w-full"
    >
      <header
        class="flex flex-wrap justify-end items-center mb-10 gap-6 font-sans"
      >
        <!-- Controls -->
        <div class="flex flex-wrap gap-6 items-center flex-1 min-w-[300px]">
          <div class="relative flex-1 max-w-lg min-w-[250px]">
            <input
              type="text"
              placeholder="Cerca..."
              class="input input-bordered rounded-full w-full pr-12 border-p-soft bg-white text-p-dark placeholder-p-medium focus:border-p-medium focus:ring-2 focus:ring-p-soft focus:outline-none transition-all shadow-sm"
            />
            <button
              type="button"
              aria-label="Submit search"
              class="absolute right-2 top-0 bottom-0 my-auto flex items-center justify-center w-10 h-10 rounded-full text-p-medium hover:bg-p-soft/30 hover:text-p-dark active:scale-95 transition-all outline-none cursor-pointer focus:ring-2 focus:ring-p-medium"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </button>
          </div>

          <div
            x-bind:class="{ 'aura aura-dual aura-md text-p-soft rounded-full': !selectedMuseum }"
          >
            <select
              x-model="selectedMuseum"
              class="select select-bordered rounded-full w-56 border-p-soft bg-white text-p-dark focus:border-p-medium focus:ring-2 focus:ring-p-soft focus:outline-none font-medium shadow-sm cursor-pointer transition-all"
            >
              <option disabled selected value="">Seleziona museo</option>
              <template x-for="museum in museums" :key="museum._id">
                <option x-bind:value="museum._id" x-text="museum.name"></option>
              </template>
            </select>
          </div>

          <!-- Toggle Container con ID dedicato -->
          <div
            id="toggle-switch"
            x-show="selectedMuseum"
            class="flex items-center border border-p-soft rounded-full h-12 p-1 bg-white shadow-sm w-64"
          >
            <button
              @click="selectedView = 'VISITE'"
              :class="selectedView === 'VISITE'
             ? 'flex-1 h-full rounded-full bg-p-medium text-white font-semibold text-sm transition-all duration-150 active:scale-95 shadow-sm cursor-pointer'
             : 'flex-1 h-full rounded-full bg-transparent text-p-medium hover:bg-p-soft/20 font-semibold text-sm transition-all duration-150 active:scale-95 cursor-pointer'"
            >
              VISITE
            </button>
            <button
              @click="selectedView = 'ITEM'"
              :class="selectedView === 'ITEM'
             ? 'flex-1 h-full rounded-full bg-p-medium text-white font-semibold text-sm transition-all duration-150 active:scale-95 shadow-sm cursor-pointer'
             : 'flex-1 h-full rounded-full bg-transparent text-p-medium hover:bg-p-soft/20 font-semibold text-sm transition-all duration-150 active:scale-95 cursor-pointer'"
            >
              ITEM
            </button>
          </div>
        </div>

        <!-- SVG Items -->
        <div class="flex flex-row justify-center items-center gap-3">
          <div class="flex items-center gap-2">
            <a
              class="nav-icon-link group !p-0 !border-none shadow-sm rounded-xl hover:!bg-transparent"
              href="../home/"
            >
              <svg
                width="48"
                height="48"
                viewBox="0 0 48 48"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  width="48"
                  height="48"
                  rx="12"
                  fill="white"
                  stroke="none"
                  class="group-hover:fill-[var(--color-p-medium)] transition-colors"
                />
                <path
                  d="M24 12 L10 24 H14 V36 H22 V28 H26 V36 H34 V24 H38 Z"
                  fill="var(--color-p-medium)"
                  class="group-hover:fill-[var(--color-p-light)] transition-colors"
                />
              </svg>
            </a>
            <a
              class="nav-icon-link group !p-0 !border-none shadow-sm rounded-xl hover:!bg-transparent"
              href="/marketplace/"
            >
              <svg
                width="48"
                height="48"
                viewBox="0 0 48 48"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  width="48"
                  height="48"
                  rx="12"
                  fill="white"
                  stroke="none"
                  class="group-hover:fill-[var(--color-p-medium)] transition-colors"
                />
                <path
                  d="M12 20 L15 12 H33 L36 20 V24 H34 V36 H14 V24 H12 V20 Z M18 24 V34 H30 V24 H18 Z M16 18 H32 L30 14 H18 L16 18 Z"
                  fill="var(--color-p-medium)"
                  class="group-hover:fill-[var(--color-p-light)] transition-colors"
                />
              </svg>
            </a>
            <a
              class="nav-icon-link group !p-0 !border-none shadow-sm rounded-xl hover:!bg-transparent"
              href="/editor/"
            >
              <svg
                width="48"
                height="48"
                viewBox="0 0 48 48"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  width="48"
                  height="48"
                  rx="12"
                  fill="white"
                  stroke="none"
                  class="group-hover:fill-[var(--color-p-medium)] transition-colors"
                />
                <path
                  transform="translate(24, 24) scale(0.85) translate(-24, -24)"
                  d="M14 8 H26 L36 18 V38 A2 2 0 0 1 34 40 H14 A2 2 0 0 1 12 38 V10 A2 2 0 0 1 14 8 Z M26 11 V18 H33 L26 11 Z M18 22 V24 H30 V22 H18 Z M18 28 V30 H30 V28 H18 Z M18 34 V36 H26 V34 H18 Z"
                  fill="var(--color-p-medium)"
                  class="group-hover:fill-[var(--color-p-light)] transition-colors"
                />
              </svg>
            </a>
            <a
              class="nav-icon-link group !p-0 !border-none shadow-sm rounded-xl hover:!bg-transparent"
              href="../navigator/"
            >
              <svg
                width="48"
                height="48"
                viewBox="0 0 48 48"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  width="48"
                  height="48"
                  rx="12"
                  fill="white"
                  stroke="none"
                  class="group-hover:fill-[var(--color-p-medium)] transition-colors"
                />
                <path
                  d="M24 8 A16 16 0 1 0 24 40 A16 16 0 0 0 24 8 Z M24 12 A12 12 0 1 1 24 36 A12 12 0 0 1 24 12 Z M18 30 L22 20 L32 16 L28 26 L18 30 Z M25.5 23.5 A1.5 1.5 0 1 0 25.5 20.5 A1.5 1.5 0 0 0 25.5 23.5 Z"
                  fill="var(--color-p-medium)"
                  class="group-hover:fill-[var(--color-p-light)] transition-colors"
                />
              </svg>
            </a>
          </div>

          <details class="avatar dropdown dropdown-end z-20">
            <summary
              class="nav-avatar-trigger list-none cursor-pointer"
            ></summary>
            <ul class="nav-dropdown-menu mt-16">
              <li>
                <a
                  x-show="user"
                  class="shared-button-flex-secondary shadow-none"
                  href="../profile"
                  >Profilo</a
                >
              </li>
              <li>
                <button
                  x-show="user"
                  class="shared-button-flex-warning shadow-none mt-2"
                  href="../home"
                  @click="logout"
                >
                  Esci
                </button>
              </li>
              <li>
                <a
                  x-show="!user"
                  class="shared-button-flex-secondary shadow-none"
                  href="../login"
                  >Accedi</a
                >
              </li>
            </ul>
          </details>
        </div>
      </header>

      <div
        id="item-container"
        class="grid grid-cols-[repeat(auto-fit,minmax(280px,1fr))] gap-8"
      >
        <template x-for="thing in filtered" :key="thing._id">
          <!-- Call your card-building function here, or render markup directly -->
          <div :class="decorator" x-html="makeStaticCard(thing)"></div>
        </template>
      </div>
    </main>
    <script defer>
      document.addEventListener('alpine:init', () => {
        Alpine.data('marketplaceComponent', () => ({
          decorator: `w-full h-80 rounded-3xl flex flex-col overflow-hidden shadow-lg border border-p-soft bg-white group hover:-translate-y-1 hover:shadow-xl transition-all duration-300`,
          museums: [],
          selectedMuseum: '',
          allTours: [],
          selectedView: 'VISITE', // or 'ITEM'
          user: null,
          async logout() {
            await fetch('/api/logout', {
              method: 'POST',
              credentials: 'include',
            })
            window.location.href = '../home/'
          },
          get filteredTours() {
            return this.selectedMuseum
              ? this.allTours.filter((t) => t.museum === this.selectedMuseum)
              : this.allTours
          },
          get filteredItems() {
            return this.selectedMuseum
              ? this.allItems.filter(
                  (item) => item.museum === this.selectedMuseum,
                )
              : this.allItems
          },
          get filtered() {
            // This getter can drive your template rendering.
            return this.selectedView === 'VISITE'
              ? this.filteredTours
              : this.filteredItems
          },
          async init() {
            this.museums = await fetch('/api/museums/').then((r) => r.json())
            this.allTours = await fetch('/api/tours/').then((r) => r.json())
            this.allItems = await fetch('/api/items/').then((r) => r.json())
            this.user = await fetch('/api/profile/')
              .then((r) => (r.ok ? r.json() : null))
              .catch((_) => null)
          },
        }))
      })
    </script>
    <script src="index.js" type="module" defer></script>
  </body>
</html>
