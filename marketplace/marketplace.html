<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace</title>

    <link href="../styles.css" rel="stylesheet" type="text/css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body
    class="flex h-screen bg-p-light text-p-dark font-serif selection:bg-p-soft"
  >
    <main class="flex-1 flex flex-col p-10 overflow-y-auto w-full">
      <header
        class="flex flex-wrap flex-row-reverse justify-between items-start mb-10 gap-6 font-sans"
      >
        <div class="flex flex-row justify-center items-center gap-3">
          <div class="flex items-center gap-2">
            <a class="nav-icon-link" href="../home/">H</a>
            <a class="nav-icon-link" href="/marketplace/">M</a>
            <a class="nav-icon-link" href="/editor/">E</a>
            <a class="nav-icon-link" href="../navigator/">N</a>
          </div>

          <details class="avatar dropdown dropdown-end z-20">
            <summary class="nav-avatar-trigger"></summary>
            <ul class="nav-dropdown-menu">
              <li>
                <a class="hover:bg-p-soft/20 rounded-lg" href="../profile"
                  >Profilo</a
                >
              </li>
              <li>
                <a
                  class="hover:bg-p-warning/20 rounded-lg text-p-warning"
                  href="../home"
                  >Esci</a
                >
              </li>
            </ul>
          </details>
        </div>

        <div class="flex flex-wrap gap-6 items-center flex-1 min-w-[300px]">
          <div class="relative flex-1 max-w-lg min-w-[250px]">
            <input
              type="text"
              placeholder="Cerca..."
              class="input input-bordered rounded-full w-full pr-12 border-p-soft bg-white text-p-dark placeholder-p-medium focus:border-p-medium focus:ring-2 focus:ring-p-soft focus:outline-none transition-all shadow-sm"
            />
            <button
              type="button"
              aria-label="Submit search"
              class="absolute right-2 top-1.5 p-2 rounded-full text-p-medium hover:bg-p-soft/30 hover:text-p-dark active:scale-95 transition-all outline-none focus:ring-2 focus:ring-p-medium"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </button>
          </div>

          <select
            class="select select-bordered rounded-full w-56 border-p-soft bg-white text-p-dark focus:border-p-medium focus:ring-2 focus:ring-p-soft focus:outline-none font-medium shadow-sm cursor-pointer transition-all"
          >
            <option disabled selected>Museo</option>
            <option>Museum 1</option>
            <option>Museum 2</option>
          </select>

          <!-- Toggle Container con ID dedicato -->
          <div
            id="toggle-switch"
            class="flex items-center border border-p-soft rounded-full h-12 p-1 bg-white shadow-sm w-64"
          >
            <button
              class="flex-1 h-full rounded-full bg-p-medium text-white font-semibold text-sm transition-all duration-150 active:scale-95 shadow-sm"
            >
              VISITE
            </button>
            <button
              class="flex-1 h-full rounded-full bg-transparent text-p-medium hover:bg-p-soft/20 font-semibold text-sm transition-all duration-150 active:scale-95"
            >
              ITEM
            </button>
          </div>
        </div>
      </header>

      <div
        id="item-container"
        class="grid grid-cols-[repeat(auto-fit,minmax(280px,1fr))] gap-8"
      ></div>
    </main>

    <script src="index.js" type="module" defer></script>
  </body>
</html>
