<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>
      Draggable Dots (Swap) Vertical - Alpine.js + Tailwind Responsive
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div
      x-data="draggableDots()"
      x-init="resizeLine(); window.addEventListener('resize', resizeLine)"
      class="h-[70vh] max-h-[90vh] min-h-[420px] w-32 sm:w-56 flex items-center justify-center relative select-none"
      @mousemove.window="dragging && onDrag($event)"
      @mouseup.window="dragging && endDrag()"
      ref="container"
    >
      <!-- Line -->
      <div
        class="absolute w-2.5 bg-blue-500 left-1/2 -translate-x-1/2"
        style="top: -100vh; height: 300vh; z-index: 0"
      ></div>
      <!-- Dots -->
      <template x-for="(dotObj, idx) in dots" :key="dotObj.label">
        <div class="absolute flex items-center" :style="containerDotStyle(idx)">
          <div
            class="rounded-[30%] border-4 font-bold text-white transition-all duration-200 cursor-grab flex items-center justify-center bg-blue-500 border-blue-500"
            :class="{ 'scale-110 z-50': draggingDot === idx }"
            :style="dotStyle(idx)"
            @mousedown.prevent="startDrag(idx, $event)"
          >
            <span
              class="absolute left-full ml-[2em] top-1/2 -translate-y-1/2 mr-3 text-gray-800 px-0 py-1 rounded text-[15px] min-w-[110px] text-center border-0 select-none bg-transparent"
              x-text="dotObj.label"
            ></span>
          </div>
        </div>
      </template>
    </div>
    <script>
      function draggableDots() {
        const labels = [
          'Douglas',
          'Mustang',
          'Dolphin',
          'Otterman',
          'Rabbits',
          'Gazelle',
          'Hamsterz',
          'Wombats',
          'Seagull',
          'Badgers',
        ]
        return {
          DOT_SIZE: 28,
          dots: labels.map((label) => ({ label })),
          dragging: false,
          draggingDot: null,
          dragOffsetY: 0,
          mouseY: 0,
          PAD: 0,
          LINE_HEIGHT: 0,
          SPACING: 0,
          resizeLine() {
            const container =
              this.$refs.container || document.querySelector('[x-data]')
            if (!container) return
            const h = container.offsetHeight
            this.LINE_HEIGHT = Math.max(h, 420)
            // Use 5% padding top and bottom, so 90% for the usable dot space
            this.PAD = Math.round(this.LINE_HEIGHT * 0.05)
            this.SPACING =
              (this.LINE_HEIGHT - 2 * this.PAD) / (this.dots.length - 1)
          },
          startDrag(idx, e) {
            this.dragging = true
            this.draggingDot = idx
            const dotRect = e.target.getBoundingClientRect()
            this.dragOffsetY = e.clientY - (dotRect.top + this.DOT_SIZE / 2)
            this.mouseY = e.clientY
          },
          onDrag(e) {
            if (!this.dragging || this.draggingDot === null) return

            this.mouseY = e.clientY
            const container =
              this.$refs.container || document.querySelector('[x-data]')
            const cRect = container.getBoundingClientRect()
            let relY = this.mouseY - cRect.top - this.dragOffsetY

            relY = Math.max(
              this.PAD,
              Math.min(this.LINE_HEIGHT - this.PAD, relY),
            )

            let slot = Math.round((relY - this.PAD) / this.SPACING)
            slot = Math.max(0, Math.min(this.dots.length - 1, slot))

            if (slot !== this.draggingDot) {
              const temp = this.dots[this.draggingDot]
              this.dots.splice(this.draggingDot, 1)
              this.dots.splice(slot, 0, temp)
              this.draggingDot = slot
            }
          },
          endDrag() {
            this.dragging = false
            this.draggingDot = null
          },
          containerDotStyle(idx) {
            let top
            if (this.dragging && this.draggingDot === idx && this.mouseY) {
              const container =
                this.$refs.container || document.querySelector('[x-data]')
              const cRect = container.getBoundingClientRect()
              let relY = this.mouseY - cRect.top - this.dragOffsetY
              relY = Math.max(
                this.PAD,
                Math.min(this.LINE_HEIGHT - this.PAD, relY),
              )
              top = relY
            } else {
              top = this.PAD + idx * this.SPACING
            }
            return `width:auto;left:50%;top:${top}px;transform:translate(-50%,-50%);`
          },
          dotStyle(idx) {
            const size = `${this.DOT_SIZE}px`
            return `width:${size};height:${size};font-size:14px;display:inline-block;`
          },
        }
      }
    </script>
  </body>
</html>
