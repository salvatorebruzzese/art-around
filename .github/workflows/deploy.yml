name: Build and Deploy

on:
  push:
    branches:
      - main # deploy solo su push nel branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm run install:prod

      - name: Build frontends
        run: npm run build

      - name: Create .env file
        run: |
          echo "USR=${{ secrets.MONGO_USR }}" >> .env
          echo "PWD=${{ secrets.MONGO_PWD }}" >> .env
          echo "SITE=${{ secrets.MONGO_SITE }}" >> .env
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -az --delete-after \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='marketplace/node_modules/' \
            --exclude='navigator/node_modules/' \
            --exclude='marketplace/src/' \
            --exclude='navigator/src/' \
            --exclude='tests' \
            --exclude='marketplace/tests/' \
            --exclude='navigator/tests/' \
            --exclude='logs/' \
            --exclude='uploads/' \
            --exclude='*.ts' \
            --exclude='*.mjs' \
            --exclude='*.md' \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/web/site242556/html/" \
            marketplace/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/web/site242556/html/marketplace/" \
            navigator/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/web/site242556/html/navigator/"

      - name: Install production deps and restart server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/web/site242556/html
            /usr/local/node/bin/npm ci --omit=dev
