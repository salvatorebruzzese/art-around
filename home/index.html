<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype Interface</title>
    <!-- Google Fonts: Cormorant Garamond -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config injected from prompt -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'p-light': '#fffffd',
              'p-soft': '#90caf9',
              'p-medium': '#2196f3',
              'p-dark': '#0d47a1',
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@3.9.0/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body
    class="bg-p-light text-p-dark min-h-screen flex font-serif items-center justify-center"
  >
    <main class="text-center px-4">
      <h1 class="text-7xl md:text-8xl mb-4 text-p-dark tracking-wide">
        Art Around
      </h1>
      <p class="text-2xl md:text-3xl text-p-medium mb-12">
        Visitare musei non è mai stato così facile
      </p>

      <div class="flex flex-row flex-wrap gap-4 justify-center">
        <a
          href="../login"
          class="btn btn-primary bg-p-light text-p-dark hover:text-white hover:bg-p-medium text-3xl border-none shadow-[4px_4px_0px_rgba(13,71,161,0.3)] hover:shadow-[4px_4px_0px_rgba(13,71,161,0.7)]"
        >
          Login
        </a>
        <a
          href="../signup"
          class="btn btn-primary bg-p-light text-p-dark hover:text-white hover:bg-p-medium text-3xl border-none shadow-[4px_4px_0px_rgba(13,71,161,0.3)] hover:shadow-[4px_4px_0px_rgba(13,71,161,0.7)]"
        >
          Sign up
        </a>
        <a
          href="../marketplace/"
          class="btn btn-primary bg-p-light text-p-dark hover:text-white hover:bg-p-medium text-3xl border-none shadow-[4px_4px_0px_rgba(13,71,161,0.3)] hover:shadow-[4px_4px_0px_rgba(13,71,161,0.7)]"
        >
          Marketplace
        </a>
      </div>
    </main>
  </body>
</html>
