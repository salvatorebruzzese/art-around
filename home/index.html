<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Around</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'p-light': '#fffffd',
              'p-soft': '#90caf9',
              'p-medium': '#2196f3',
              'p-dark': '#0d47a1',
            },
            fontFamily: {
              cormorant: ['"Cormorant Garamond"', 'serif'],
            },
          },
        },
      }
    </script>

    <style>
      body {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 600;
      }
    </style>
  </head>
  <body
    class="bg-p-light text-p-dark min-h-screen flex items-center justify-center"
  >
    <main class="text-center px-4">
      <h1 class="text-7xl md:text-8xl mb-4 text-p-dark tracking-wide">
        Art Around
      </h1>
      <p class="text-2xl md:text-3xl text-p-medium mb-12">
        Visitare musei non è mai stato così facile
      </p>

      <div class="flex gap-4 justify-center">
        <a
          href="home/login"
          class="btn btn-primary bg-p-light text-p-dark hover:text-white hover:bg-p-dark text-3xl border-none shadow-[4px_4px_0px_rgba(13,71,161,0.3)] hover:shadow-[4px_4px_0px_rgba(13,71,161,0.7)]"
        >
          Login
        </a>
        <a
          href="home/signup"
          class="btn btn-primary bg-p-light text-p-dark hover:text-white hover:bg-p-dark text-3xl border-none shadow-[4px_4px_0px_rgba(13,71,161,0.3)] hover:shadow-[4px_4px_0px_rgba(13,71,161,0.7)]"
        >
          Sign up
        </a>
      </div>
    </main>
  </body>
</html>
