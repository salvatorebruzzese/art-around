<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap"
      rel="stylesheet"
    />

    <link href="../styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body
    class="font-serif bg-p-light text-p-dark min-h-screen flex items-center justify-center"
  >
    <main class="text-center px-4 w-full max-w-sm">
      <h2 class="text-5xl mb-8 text-p-dark tracking-wide">Sign Up</h2>
      <form
        id="signup-form"
        class="flex flex-col gap-4 justify-items-start text-left"
      >
        <div class="form-control w-full">
          <label for="username" class="label"
            ><span class="label-text text-p-medium text-xl mb-2"
              >Username</span
            ></label
          >
          <input
            type="text"
            id="username"
            name="username"
            required
            class="input input-bordered w-full text-p-dark bg-transparent"
          />
        </div>
        <div class="form-control w-full">
          <label for="email" class="label"
            ><span class="label-text text-p-medium text-xl mb-2"
              >Email</span
            ></label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            class="input input-bordered w-full text-p-dark bg-transparent"
          />
        </div>
        <div class="form-control w-full">
          <label for="password" class="label"
            ><span class="label-text text-p-medium text-xl mb-2"
              >Password</span
            ></label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            class="input input-bordered w-full text-p-dark bg-transparent"
          />
        </div>
        <button
          type="submit"
          class="btn btn-primary bg-p-medium text-p-light hover:text-white hover:bg-p-dark text-2xl border-none"
        >
          Sign Up
        </button>
      </form>
      <a
        href="/"
        class="text-center block mt-6 text-p-medium hover:text-p-dark hover:underline text-lg"
        >Torna alla Home</a
      >
    </main>
    <script type="module" src="./signup.js"></script>
  </body>
</html>
